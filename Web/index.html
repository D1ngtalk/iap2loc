<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iAP2 定位控制台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --line: #e3e2dd; --text: #23231f; --muted: #6f6d66;
    --accent: #185fa5; --ok: #0f6e56; --warn: #ba7517; --bad: #a32d2d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); }
  header { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; font-weight: 500; margin: 0; white-space: nowrap; }
  .chip { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted);
    background: #fafaf8; border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; white-space: nowrap; }
  .chip.warn { color: var(--warn); border-color: #f0dcb6; background: #fdf6e8; }
  .banner { padding: 9px 14px; background: #fbeceb; color: var(--bad); border-bottom: 1px solid #f0c9c6;
    font-size: 13px; line-height: 1.5; }
  .banner a { color: var(--bad); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(24,95,165,.45); } 70% { box-shadow: 0 0 0 7px rgba(24,95,165,0); } 100% { box-shadow: 0 0 0 0 rgba(24,95,165,0); } }
  button.primary.dirty { animation: pulse 1.8s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { button.primary.dirty { animation: none; } }
  button:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  .grow { flex: 1; }
  button { font: inherit; padding: 5px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button:hover { border-color: #c9c8c2; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); border-color: #e8c4c4; }
  button.mini { padding: 2px 8px; font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; min-width: 0; }
  aside { width: 400px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .scroll { overflow: auto; padding: 12px 14px; flex: 1; }
  section { margin-bottom: 16px; }
  section h2 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 8px; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
  .row { display: flex; gap: 8px; margin-bottom: 7px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .row > label { width: 62px; color: var(--muted); flex: none; font-size: 12px; }
  .row > input, .row > select { flex: 1; min-width: 0; }
  input, select { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--text); }
  input:focus, select:focus { outline: 2px solid #cfe0f2; border-color: var(--accent); }
  input[type=checkbox] { flex: none; width: 15px; height: 15px; accent-color: var(--accent); }
  .compact { flex: 0 0 58px !important; min-width: 0; padding: 3px 5px; }
  .dash { color: var(--muted); flex: none; }
  .unit { color: var(--muted); font-size: 11.5px; flex: none; }
  .hint { color: var(--muted); font-size: 11.5px; margin: 2px 0 6px; }
  .readout { display: flex; justify-content: space-between; gap: 8px; font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; padding: 3px 8px; background: #fafaf8; border: 1px solid var(--line); border-radius: 7px; margin-bottom: 5px; }
  .readout span:first-child { color: var(--muted); flex: none; }
  .readout span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .seg button { border: 0; border-radius: 0; padding: 5px 8px; flex: 1; background: #fff; font-size: 12px; }
  .seg button.active { background: #eaf2fb; color: var(--accent); }
  .filebtn { display: inline-block; padding: 2px 8px; font-size: 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; cursor: pointer; white-space: nowrap; }
  .filebtn:hover { border-color: #c9c8c2; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 6px; background: #fff; }
  .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--muted); font-size: 11.5px; font-family: ui-monospace, Consolas, monospace; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #cfcdc6; flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  details { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: #fcfcfa; }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 500; }
  details[open] summary { margin-bottom: 8px; }
  #log { flex: none; height: 190px; border-top: 1px solid var(--line); background: #1f1f1d; color: #d8d6cf;
    overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; padding: 7px 9px; }
  #log div { white-space: pre-wrap; word-break: break-all; }
  #log .t { color: #7d7a72; } #log .ok { color: #7fd1a8; } #log .error { color: #f0a3a3; }
  #log .warn { color: #e8c27a; } #log .step { color: #9cc4ea; }
  body.log-hidden #log { display: none; }
  .mapnote { position: absolute; z-index: 500; left: 12px; top: 12px; background: rgba(255,255,255,.94);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .wp span { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 10px; line-height: 18px; text-align: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  #toast { position: fixed; z-index: 900; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #23231f; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12.5px;
    max-width: 70vw; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
  #toast.error { background: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>iAP2 定位控制台</h1>
  <span class="chip warn" id="dirtyChip" style="display:none">有未应用的修改</span>
  <div class="spacer"></div>
  <button id="apply" class="primary mini" disabled>应用修改</button>
  <button id="favorite" class="mini">收藏当前</button>
  <button id="stopAll" class="danger mini">停止全部</button>
</header>

<div id="buildWarning" class="banner" style="display:none"></div>

<main>
  <div id="map"></div>
  <aside>
    <div class="scroll">
      <section>
        <h2>地图基准<span class="grow"></span></h2>
        <div class="seg" id="datum">
          <button data-datum="wgs" class="active">OSM</button>
          <button data-datum="gcj">高德</button>
        </div>
      </section>

      <section>
        <h2>设备<span class="grow"></span><button id="refreshDevices" class="mini">刷新</button></h2>
        <div id="sessions"></div>
        <div class="row" style="margin-top:8px">
          <select id="deviceSelect" style="flex:1"><option>正在读取…</option></select>
          <button id="addDevice" class="primary mini">连接</button>
        </div>
        <div class="row"><label style="width:auto">显示非 Apple 设备</label><input id="showAll" type="checkbox" /></div>
      </section>

      <section>
        <h2>收藏<span class="grow"></span></h2>
        <div id="favorites"><p class="hint">点右上角「收藏当前」保存坐标。</p></div>
      </section>

      <section>
        <h2>目标<span class="grow"></span></h2>
        <p class="hint">点击地图选择位置或在下方填写坐标</p>
        <div class="seg" id="modes"></div>

        <div class="panel" data-panel="point">
          <div class="row"><label>纬度</label><input id="lat" type="number" step="0.000001" /><label>经度</label><input id="lon" type="number" step="0.000001" /></div>
        </div>
        
        <div class="panel" data-panel="walk" style="display:none">
          <p class="hint">在地图上依次点击添加路径点；拖动序号可调整，右键删除单点。</p>
          <div class="row wrap">
            <span class="chip" id="routeInfo">未添加</span>
            <span class="grow"></span>
            <button id="routeUndo" class="mini">撤销</button>
            <button id="routeClear" class="mini danger">清空</button>
            <label class="filebtn">导入 GPX<input id="gpxFile" type="file" accept=".gpx,application/gpx+xml" hidden /></label>
          </div>
          <div class="row"><label>速度 km/h</label><input id="walkSpeed" type="number" min="0.5" step="0.5" value="5" /></div>
          <div class="row"><label>循环</label><input id="walkLoop" type="checkbox" checked /><span class="hint" style="margin:0">到终点后从头再来</span></div>
          <div class="readout" id="walkProgress" style="display:none"><span>已走</span><span id="walkProgressText">—</span></div>
        </div>
        <div class="row"><label>随机偏移</label>
          <input id="jitterPosition" type="checkbox" />
          <input id="jitterMeters" class="compact" type="number" step="1" value="0" />
          <span class="unit">m</span>
        </div>
        <div class="row"><label>精度</label>
          <span id="accuracyInput" class="row" style="display:flex; margin:0; flex:1">
            <input id="accuracy" class="compact" type="number" step="0.1" value="5" />
            <span class="unit">m</span>
          </span>
          <span id="accuracyRange" class="row" style="display:none; margin:0; flex:1">
            <input id="accuracyMin" class="compact" type="number" step="0.1" value="3" />
            <span class="dash">–</span>
            <input id="accuracyMax" class="compact" type="number" step="0.1" value="12" />
            <span class="unit">m</span>
          </span>
        </div>
        <div class="row"><label>随机</label><input id="jitterAccuracy" type="checkbox" /></div>

        <div class="row"><label>高度 m</label>
          <span id="altInput" class="row" style="display:flex; margin:0; flex:1">
            <input id="alt" class="compact" type="number" step="0.1" value="10" />
            <span class="unit">m</span>
          </span>
          <span id="altRange" class="row" style="display:none; margin:0; flex:1">
            <input id="altitudeMin" class="compact" type="number" step="1" value="5" />
            <span class="dash">–</span>
            <input id="altitudeMax" class="compact" type="number" step="1" value="20" />
            <span class="unit">m</span>
          </span>
        </div>
        <div class="row"><label>随机</label><input id="jitterAltitude" type="checkbox" /></div>

        <div class="readout" id="resolvedRow" style="display:none"><span>实际发送</span><span id="resolvedText">—</span></div>
        <div class="readout"><span>已应用</span><span id="appliedText">—</span></div>

        <div class="row" style="margin-top:6px"><button id="locate" style="flex:1" class="mini">当前位置</button><button id="copy" style="flex:1" class="mini">复制坐标</button></div>
      </section>

      <section>
        <details>
          <summary>高级设置</summary>
          <span class="readout" id="chipWgs">—</span>
          <span class="readout" id="chipGcj">—</span>
          <div class="readout"><span>配件身份</span><span id="identityText">—</span></div>
          <div class="row"><button id="rotateIdentity" class="mini" style="flex:1">更换身份与蓝牙地址</button></div>
          <div class="row"><label>周期 ms</label><input id="rate" type="number" min="10" step="10" value="250" /></div>
          <div class="row"><label>定位质量</label>
            <select id="quality">
              <option value="0">0 · 无效</option>
              <option value="1" selected>1 · GPS 单点</option>
              <option value="2">2 · DGPS</option>
              <option value="3">3 · PPS</option>
              <option value="4">4 · RTK 固定</option>
              <option value="5">5 · RTK 浮动</option>
              <option value="6">6 · 估算</option>
              <option value="7">7 · 人工</option>
              <option value="8">8 · 模拟</option>
            </select>
          </div>
          <div class="row"><label>卫星数</label><input id="satellites" type="number" min="0" max="99" step="1" value="8" /></div>
          <div class="row"><label>MFi密钥</label><input id="identity" placeholder="留空 = 用内置密钥" /></div>
          <div class="row"><label>传输</label>
            <select id="transport">
              <option value="bt">蓝牙 RFCOMM</option>
              <option value="tcp">TCP（Wi-Fi 隧道）</option>
            </select>
          </div>
          <div class="row" id="rowHost" style="display:none"><label>TCP 地址</label><input id="host" value="127.0.0.1" /></div>
          <div class="row" id="rowPort" style="display:none"><label>TCP 端口</label><input id="port" type="number" value="8738" /></div>
          <div class="row"><label style="width:auto">控制台日志</label><input id="showLog" type="checkbox" /><span class="hint" style="margin:0">在下方显示实时输出</span></div>
          <p class="hint">周期、定位质量与卫星数实时生效；MFi 密钥对之后新加的设备生效。</p>
        </details>
      </section>
    </div>
    <div id="log"></div>
  </aside>
</main>

<div id="toast" style="display:none"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PI = Math.PI, AXIS = 6378245.0, EE = 0.00669342162296594323;
function outOfChina(lat, lon) { return !(lon > 73.66 && lon < 135.05 && lat > 3.86 && lat < 53.55); }
function transformLat(x, y) {
  let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
  r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
  return r;
}
function transformLon(x, y) {
  let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
  r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
  return r;
}
function wgs2gcj(lat, lon) {
  if (outOfChina(lat, lon)) return [lat, lon];
  let dLat = transformLat(lon - 105, lat - 35), dLon = transformLon(lon - 105, lat - 35);
  const radLat = lat / 180 * PI;
  let magic = Math.sin(radLat); magic = 1 - EE * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((AXIS * (1 - EE)) / (magic * sq) * PI);
  dLon = (dLon * 180) / (AXIS / sq * Math.cos(radLat) * PI);
  return [lat + dLat, lon + dLon];
}
function gcj2wgs(lat, lon) {
  let wLat = lat, wLon = lon;
  for (let i = 0; i < 8; i++) {
    const [gLat, gLon] = wgs2gcj(wLat, wLon);
    wLat += lat - gLat; wLon += lon - gLon;
  }
  return [wLat, wLon];
}

const el = id => document.getElementById(id);

// Adding a mode = adding an entry here plus a [data-panel] block and a branch in the payload.
const MODES = [
  { id: 'point', label: '单点' },
  { id: 'walk', label: '行走' }
];

const S = {
  mode: 'point',
  target: { lat: 31.2304, lon: 121.4737, alt: 10, accuracy: 5, quality: 1, satellites: 8,
            jitterPosition: false, jitterMeters: 10,
            jitterAccuracy: false, accuracyMin: 3, accuracyMax: 12,
            jitterAltitude: false, altitudeMin: 5, altitudeMax: 20 },
  route: [],
  walkSpeed: 5,
  walkLoop: true,
  rate: 250, identity: '', transport: 'bt', host: '127.0.0.1', port: 8738,
  datum: 'wgs', sessions: [], devices: [], favorites: [], editing: false
};

let map = null, marker = null, routeLine = null, routeLayer = null, osmLayer = null, amapLayer = null;

function toLatLng(point) {
  const [lat, lon] = S.datum === 'gcj' ? wgs2gcj(point.lat, point.lon) : [point.lat, point.lon];
  return [lat, lon];
}

function initMap() {
  if (typeof L === 'undefined') {
    el('map').innerHTML = '<div class="mapnote">地图资源未加载（离线或 CDN 不可达）。坐标仍可手动输入。</div>';
    return;
  }
  map = L.map('map', { zoomControl: true }).setView([S.target.lat, S.target.lon], 12);
  osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
  amapLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    { subdomains: '1234', maxZoom: 18, attribution: '&copy; 高德地图' });
  osmLayer.addTo(map);

  marker = L.marker([S.target.lat, S.target.lon], { draggable: true }).addTo(map);
  marker.on('dragend', () => {
    const ll = marker.getLatLng();
    applyPicked(ll.lat, ll.lng);
  });

  map.on('click', event => addOnMap(event.latlng.lat, event.latlng.lng));
}

function addOnMap(lat, lon) {
  const [wLat, wLon] = S.datum === 'gcj' ? gcj2wgs(lat, lon) : [lat, lon];
  if (S.mode === 'walk') {
    S.route.push({ lat: +wLat.toFixed(6), lon: +wLon.toFixed(6), alt: null });
    renderRoute();
    markDirty();
    return;
  }
  applyPicked(wLat, wLon);
}

function applyPicked(lat, lon) {
  S.target.lat = +lat.toFixed(6);
  S.target.lon = +lon.toFixed(6);
  renderTarget(true);
  readInputs();
  markDirty();
}

function renderTarget(updateInputs) {
  const [gLat, gLon] = wgs2gcj(S.target.lat, S.target.lon);
  el('chipWgs').textContent = 'WGS ' + S.target.lat.toFixed(6) + ', ' + S.target.lon.toFixed(6);
  el('chipGcj').textContent = 'GCJ ' + gLat.toFixed(6) + ', ' + gLon.toFixed(6);
  if (updateInputs) {
    el('lat').value = S.target.lat.toFixed(6);
    el('lon').value = S.target.lon.toFixed(6);
  }
  if (map && marker) marker.setLatLng(S.datum === 'gcj' ? [gLat, gLon] : [S.target.lat, S.target.lon]);
}

function setDatum(next) {
  if (next === S.datum) return;
  S.datum = next;
  document.querySelectorAll('#datum button').forEach(b => b.classList.toggle('active', b.dataset.datum === next));
  if (map) {
    if (next === 'gcj') { map.removeLayer(osmLayer); amapLayer.addTo(map); }
    else { map.removeLayer(amapLayer); osmLayer.addTo(map); }
    const [gLat, gLon] = wgs2gcj(S.target.lat, S.target.lon);
    map.setView(next === 'gcj' ? [gLat, gLon] : [S.target.lat, S.target.lon], map.getZoom());
  }
  renderTarget(false);
  renderRoute();
}
document.querySelectorAll('#datum button').forEach(b => b.addEventListener('click', () => setDatum(b.dataset.datum)));

/* ---------- modes ---------- */

function buildModes() {
  const box = el('modes');
  box.innerHTML = '';
  MODES.forEach(mode => {
    const button = document.createElement('button');
    button.dataset.mode = mode.id;
    button.textContent = mode.label;
    button.addEventListener('click', () => setMode(mode.id));
    box.appendChild(button);
  });
}

function setMode(next) {
  if (next === S.mode) return;
  S.mode = next;
  renderModes();
  markDirty();
}

function renderModes() {
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === S.mode));
  document.querySelectorAll('[data-panel]').forEach(panel => {
    panel.style.display = panel.dataset.panel === S.mode ? '' : 'none';
  });
  if (map && marker) {
    if (S.mode === 'point') { if (!map.hasLayer(marker)) marker.addTo(map); }
    else if (map.hasLayer(marker)) { map.removeLayer(marker); }
  }
  renderRoute();
}

/* ---------- route ---------- */

function waypointIcon(index) {
  return L.divIcon({ className: 'wp', html: '<span>' + index + '</span>', iconSize: [18, 18], iconAnchor: [9, 9] });
}

function renderRoute() {
  if (!map) { renderRouteInfo(); return; }
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }

  if (S.mode !== 'walk' || S.route.length === 0) { renderRouteInfo(); return; }

  const points = S.route.map(toLatLng);
  if (points.length >= 2) {
    routeLine = L.polyline(points, { color: '#185fa5', weight: 3, opacity: 0.9 }).addTo(map);
  }

  routeLayer = L.layerGroup();
  points.forEach((latlng, index) => {
    const node = L.marker(latlng, { draggable: true, icon: waypointIcon(index + 1) });
    node.on('dragend', () => {
      const position = node.getLatLng();
      const [lat, lon] = S.datum === 'gcj' ? gcj2wgs(position.lat, position.lng) : [position.lat, position.lng];
      S.route[index] = { ...S.route[index], lat: +lat.toFixed(6), lon: +lon.toFixed(6) };
      renderRoute();
      markDirty();
    });
    node.on('contextmenu', event => {
      L.DomEvent.preventDefault(event.originalEvent || event);
      S.route.splice(index, 1);
      renderRoute();
      markDirty();
    });
    routeLayer.addLayer(node);
  });
  routeLayer.addTo(map);
  renderRouteInfo();
}

function renderRouteInfo() {
  const length = routeLength();
  el('routeInfo').textContent = S.route.length === 0
    ? '未添加'
    : S.route.length + ' 个点 · ' + (length / 1000).toFixed(2) + ' km';
}

function routeLength() {
  let total = 0;
  for (let i = 1; i < S.route.length; i++) total += distanceMeters(S.route[i - 1], S.route[i]);
  return total;
}

function distanceMeters(a, b) {
  const radius = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * radius * Math.asin(Math.min(1, Math.sqrt(h)));
}

el('routeUndo').addEventListener('click', () => {
  if (S.route.length === 0) return;
  S.route.pop();
  renderRoute();
  markDirty();
});

el('routeClear').addEventListener('click', () => {
  if (S.route.length === 0) return;
  if (!confirm('清空整条路径？')) return;
  S.route = [];
  renderRoute();
  markDirty();
});

el('gpxFile').addEventListener('change', async event => {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;

  let points = [];
  try {
    points = parseGpx(await file.text());
  } catch (error) {
    points = [];
  }

  if (points.length < 2) {
    notify('这个 GPX 里没有可用的轨迹点（至少需要两个）', 'error');
    return;
  }

  S.route = downsample(points, 5000);
  if (S.mode !== 'walk') S.mode = 'walk';
  renderModes();
  fitRoute();
  markDirty();
  notify('已导入 ' + S.route.length + ' 个点，' + (routeLength() / 1000).toFixed(2) + ' km');
});

function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length > 0) return [];

  const nodes = [
    ...doc.getElementsByTagName('trkpt'),
    ...doc.getElementsByTagName('rtept'),
    ...doc.getElementsByTagName('wpt')
  ];

  const points = [];
  nodes.forEach(node => {
    const lat = parseFloat(node.getAttribute('lat'));
    const lon = parseFloat(node.getAttribute('lon'));
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

    let alt = null;
    const elevation = node.getElementsByTagName('ele')[0];
    if (elevation) {
      const value = parseFloat(elevation.textContent);
      if (Number.isFinite(value)) alt = value;
    }

    const last = points[points.length - 1];
    if (last && Math.abs(last.lat - lat) < 1e-7 && Math.abs(last.lon - lon) < 1e-7) return;
    points.push({ lat: +lat.toFixed(6), lon: +lon.toFixed(6), alt });
  });

  return points;
}

function downsample(points, limit) {
  if (points.length <= limit) return points;
  const step = (points.length - 1) / (limit - 1);
  const result = [];
  for (let i = 0; i < limit; i++) result.push(points[Math.round(i * step)]);
  return result;
}

function fitRoute() {
  if (!map || S.route.length < 2) return;
  map.fitBounds(L.latLngBounds(S.route.map(toLatLng)), { padding: [40, 40] });
}

/* ---------- inputs ---------- */

function readInputs() {
  if (S.mode === 'point') {
    const lat = parseFloat(el('lat').value), lon = parseFloat(el('lon').value);
    if (Number.isFinite(lat)) S.target.lat = lat;
    if (Number.isFinite(lon)) S.target.lon = lon;
  }
  S.target.accuracy = num('accuracy', 5);
  S.target.alt = num('alt', 10);
  S.target.jitterAccuracy = el('jitterAccuracy').checked;
  S.target.jitterPosition = el('jitterPosition').checked;
  S.target.jitterAltitude = el('jitterAltitude').checked;
  S.target.accuracyMin = num('accuracyMin', 3);
  S.target.accuracyMax = num('accuracyMax', 12);
  S.target.jitterMeters = num('jitterMeters', 10);
  const quality = parseInt(el('quality').value, 10);
  S.target.quality = Number.isFinite(quality) ? quality : 1;
  const satellites = parseInt(el('satellites').value, 10);
  S.target.satellites = Number.isFinite(satellites) ? Math.max(0, Math.min(99, satellites)) : 8;
  S.target.altitudeMin = num('altitudeMin', 5);
  S.target.altitudeMax = num('altitudeMax', 20);
  S.walkSpeed = num('walkSpeed', 5);
  S.walkLoop = el('walkLoop').checked;
  S.rate = num('rate', 250);
  S.identity = el('identity').value.trim();
  S.transport = el('transport').value;
  S.host = el('host').value.trim();
  S.port = num('port', 8738);
}

function num(id, fallback) {
  const value = parseFloat(el(id).value);
  return Number.isFinite(value) ? value : fallback;
}

let dirty = false;

function onEdited() {
  readInputs();
  renderTarget(false);
  renderRouteInfo();
  markDirty();
}

function markDirty() {
  if (dirty) return;
  dirty = true;
  el('apply').disabled = false;
  el('apply').classList.add('dirty');
  el('dirtyChip').style.display = '';
}

function markClean() {
  dirty = false;
  el('apply').disabled = true;
  el('apply').classList.remove('dirty');
  el('dirtyChip').style.display = 'none';
}

function buildPayload(tolerateEmptyRoute) {
  const mode = S.mode === 'walk' && tolerateEmptyRoute && S.route.length < 2 ? 'point' : S.mode;
  return {
    mode,
    latitude: S.target.lat, longitude: S.target.lon,
    altitude: S.target.alt, accuracy: S.target.accuracy,
    jitterPosition: S.target.jitterPosition, jitterMeters: S.target.jitterMeters,
    jitterAccuracy: S.target.jitterAccuracy, accuracyMin: S.target.accuracyMin, accuracyMax: S.target.accuracyMax,
    quality: S.target.quality, satellites: S.target.satellites,
    jitterAltitude: S.target.jitterAltitude, altitudeMin: S.target.altitudeMin, altitudeMax: S.target.altitudeMax,
    rate: S.rate,
    walkSpeedKmh: S.walkSpeed, walkLoop: S.walkLoop,
    route: mode === 'walk'
      ? S.route.map(point => ({ latitude: point.lat, longitude: point.lon, altitude: point.alt }))
      : null
  };
}

async function applyTarget(options = {}) {
  readInputs();
  renderTarget(false);

  if (S.mode === 'walk' && S.route.length < 2 && !options.tolerateEmptyRoute) {
    notify('行走模式至少需要两个路径点，或导入一条 GPX', 'error');
    return false;
  }

  const result = await postJson('/api/target', buildPayload(options.tolerateEmptyRoute));
  if (result && result.ok) {
    if (result.target) { updateResolved(result.target); renderApplied(result.target); }
    markClean();
    return true;
  }

  notify((result && result.error) || '应用失败', 'error');
  return false;
}

function updateResolved(target) {
  const active = target.jitterPosition || target.jitterAccuracy || target.jitterAltitude;
  el('resolvedRow').style.display = active ? 'flex' : 'none';
  if (!active) return;

  const parts = [];
  if (target.mode !== 'walk') {
    parts.push(target.resolvedLatitude.toFixed(6) + ', ' + target.resolvedLongitude.toFixed(6));
  }
  if (target.resolvedAltitude != null) parts.push(target.resolvedAltitude.toFixed(1) + ' m 高');
  if (target.resolvedAccuracy != null) parts.push(target.resolvedAccuracy.toFixed(1) + ' m 精度');
  el('resolvedText').textContent = parts.join(' · ');
}

function renderApplied(target) {
  if (!target) return;
  if (target.mode === 'walk' && target.routePoints >= 2) {
    el('appliedText').textContent = '行走 · ' + target.routePoints + ' 点 / ' +
      (target.routeLengthMeters / 1000).toFixed(2) + ' km · 已走 ' + Math.round(target.walkTravelledMeters) + ' m';
    el('walkProgress').style.display = 'flex';
    el('walkProgressText').textContent = Math.round(target.walkTravelledMeters) + ' / ' +
      Math.round(target.routeLengthMeters) + ' m';
  } else {
    el('appliedText').textContent = '单点 · ' + target.latitude.toFixed(6) + ', ' + target.longitude.toFixed(6);
    el('walkProgress').style.display = 'none';
  }
}

['lat','lon','accuracy','alt','accuracyMin','accuracyMax','jitterMeters','altitudeMin','altitudeMax','walkSpeed','rate','satellites'].forEach(id => {
  el(id).addEventListener('input', onEdited);
});
el('quality').addEventListener('change', onEdited);
['jitterAccuracy','jitterPosition','jitterAltitude','walkLoop'].forEach(id => {
  el(id).addEventListener('change', onEdited);
});

el('jitterAccuracy').addEventListener('change', () => {
  el('accuracyInput').style.display = el('jitterAccuracy').checked ? 'none' : 'flex';
  el('accuracyRange').style.display = el('jitterAccuracy').checked ? 'flex' : 'none';
});

el('jitterAltitude').addEventListener('change', () => {
  el('altInput').style.display = el('jitterAltitude').checked ? 'none' : 'flex';
  el('altRange').style.display = el('jitterAltitude').checked ? 'flex' : 'none';
});

el('apply').addEventListener('click', () => applyTarget());
document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    if (dirty) applyTarget();
  }
});

el('transport').addEventListener('change', () => {
  const bluetooth = el('transport').value === 'bt';
  el('rowHost').style.display = bluetooth ? 'none' : 'flex';
  el('rowPort').style.display = bluetooth ? 'none' : 'flex';
  renderDevices();
});

/* ---------- log ---------- */

const logBuffer = [];
let logVisible = false;

function setLogVisible(on) {
  logVisible = on;
  el('showLog').checked = on;
  document.body.classList.toggle('log-hidden', !on);
  try { localStorage.setItem('iap2loc.showLog', on ? '1' : '0'); } catch (e) { }
  if (on) {
    el('log').innerHTML = '';
    logBuffer.slice(-300).forEach(appendLogDom);
    el('log').scrollTop = el('log').scrollHeight;
  }
}

function appendLog(entry) {
  logBuffer.push(entry);
  if (logBuffer.length > 400) logBuffer.shift();
  if (logVisible) appendLogDom(entry);
}

function appendLogDom(entry) {
  const node = document.createElement('div');
  const level = (entry.level || '').trim();
  node.innerHTML = '<span class="t">' + entry.time + '</span> <span class="' + level + '">' + level + '</span> ' + escapeHtml(entry.text);
  const log = el('log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.appendChild(node);
  if (atBottom) log.scrollTop = log.scrollHeight;
  while (log.childElementCount > 400) log.removeChild(log.firstChild);
}

function escapeHtml(text) {
  return String(text).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

let toastTimer = null;
function notify(text, level) {
  const toast = el('toast');
  toast.textContent = text;
  toast.className = level === 'error' ? 'error' : '';
  toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
}

/* ---------- api ---------- */

async function postJson(path, body) {
  try {
    const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    return await response.json();
  } catch (error) { return { ok: false, error: String(error) }; }
}

async function getJson(path) {
  try { return await (await fetch(path)).json(); } catch (error) { return null; }
}

async function loadDevices() {
  el('deviceSelect').innerHTML = '<option>读取中…</option>';
  const devices = await getJson('/api/devices');
  S.devices = Array.isArray(devices) ? devices : [];
  renderDevices();
}

function renderDevices() {
  const showAll = el('showAll').checked;
  const list = S.devices.filter(device => showAll || device.likelyApple);
  const select = el('deviceSelect');
  if (list.length === 0) {
    select.innerHTML = '<option value="">' + (S.devices.length ? '没有 Apple 设备（可勾选显示全部）' : '没有已配对设备') + '</option>';
    return;
  }
  select.innerHTML = list.map(device =>
    '<option value="' + device.address + '">' + device.name + ' · ' + device.address + (device.likelyApple ? '' : ' · 其他') + '</option>'
  ).join('');
}

el('refreshDevices').addEventListener('click', loadDevices);
el('showAll').addEventListener('change', renderDevices);

el('addDevice').addEventListener('click', async () => {
  readInputs();
  const bluetooth = S.transport === 'bt';
  const mac = el('deviceSelect').value;
  if (bluetooth && !mac) { notify('请先选择设备', 'error'); return; }

  // A new device must start from the point on screen, so apply pending edits first.
  if (!(await applyTarget({ tolerateEmptyRoute: true }))) return;

  const option = el('deviceSelect').selectedOptions[0];
  const result = await postJson('/api/sessions', {
    transport: S.transport, mac: bluetooth ? mac : null,
    host: bluetooth ? null : S.host, port: bluetooth ? null : S.port,
    identity: S.identity, rate: S.rate,
    label: bluetooth ? (option ? option.textContent.split(' · ')[0] : mac) : (S.host + ':' + S.port)
  });
  if (!result.ok) notify(result.error || '添加失败', 'error');
  pollState();
});

async function removeSession(id) {
  await postJson('/api/sessions/remove', { id });
  pollState();
}

el('stopAll').addEventListener('click', async () => { await postJson('/api/stop-all'); pollState(); });

el('rotateIdentity').addEventListener('click', async () => {
  const result = await postJson('/api/identity/rotate', {});
  if (!result || !result.ok) {
    appendLog({ time: '', level: 'error', text: (result && result.error) || '更换身份失败' });
    return;
  }
  renderIdentity(result.identity);
  appendLog({ time: '', level: 'ok', text: '配件身份已更换：' + result.identity.serial +
    (result.identity.adapter ? ' · ' + result.identity.adapter : '') + '，新添加的设备生效' });
  pollState();
});

el('favorite').addEventListener('click', async () => {
  readInputs();
  const name = prompt('收藏名称', S.target.lat.toFixed(4) + ', ' + S.target.lon.toFixed(4));
  if (name === null) return;
  await postJson('/api/favorites', {
    name, latitude: S.target.lat, longitude: S.target.lon,
    altitude: S.target.alt, accuracy: S.target.accuracy
  });
  loadFavorites();
});

el('locate').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(position => {
    S.target.lat = +position.coords.latitude.toFixed(6);
    S.target.lon = +position.coords.longitude.toFixed(6);
    if (Number.isFinite(position.coords.altitude)) { S.target.alt = +position.coords.altitude.toFixed(1); el('alt').value = S.target.alt; }
    if (Number.isFinite(position.coords.accuracy)) { S.target.accuracy = Math.max(1, +position.coords.accuracy.toFixed(1)); el('accuracy').value = S.target.accuracy; }
    renderTarget(true);
    readInputs();
    markDirty();
    if (map) map.setView(S.datum === 'gcj' ? wgs2gcj(S.target.lat, S.target.lon) : [S.target.lat, S.target.lon], 15);
  }, () => notify('浏览器拒绝或无法取得本机位置', 'error'));
});

el('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(S.target.lat.toFixed(6) + ',' + S.target.lon.toFixed(6)); } catch (error) { }
});

async function loadFavorites() {
  const list = await getJson('/api/favorites');
  S.favorites = Array.isArray(list) ? list : [];
  const box = el('favorites');
  if (S.favorites.length === 0) { box.innerHTML = '<p class="hint">点右上角「收藏当前」保存坐标。</p>'; return; }
  box.innerHTML = '';
  S.favorites.forEach(favorite => {
    const row = document.createElement('div');
    row.className = 'item';
    row.dataset.id = favorite.id;
    row.dataset.lat = favorite.latitude;
    row.dataset.lon = favorite.longitude;
    row.dataset.alt = favorite.altitude == null ? '' : favorite.altitude;
    row.dataset.accuracy = favorite.accuracy == null ? '' : favorite.accuracy;
    row.style.cursor = 'pointer';
    row.innerHTML = '<div class="name">' + escapeHtml(favorite.name) + '<div class="sub">' +
      favorite.latitude.toFixed(5) + ', ' + favorite.longitude.toFixed(5) + '</div></div>' +
      '<button class="mini danger" data-remove="' + favorite.id + '">✕</button>';
    box.appendChild(row);
  });
}

function renderSessions() {
  const box = el('sessions');
  if (S.sessions.length === 0) { box.innerHTML = '<p class="hint">尚未连接设备。</p>'; return; }
  box.innerHTML = '';
  S.sessions.forEach(session => {
    const row = document.createElement('div');
    row.className = 'item';
    const linkClass = session.link === 'Normal' ? 'ok' : (session.running ? 'warn' : 'bad');
    row.innerHTML =
      '<span class="dot ' + linkClass + '"></span>' +
      '<div class="name">' + escapeHtml(session.label) + '<div class="sub">' + escapeHtml(session.address || '') + '</div></div>' +
      '<span class="sub">' + (session.authenticated ? '已连接' : '未认证') + ' · ' + session.sent + '</span>' +
      '<button class="mini danger" data-remove="' + session.id + '">✕</button>';
    box.appendChild(row);
  });
}

function pillState(state) {
  if (!state) return;
  S.sessions = state.sessions || [];
  renderSessions();
  renderWarning(state.warning);
  renderIdentity(state.identity);
}

function renderIdentity(identity) {
  if (!identity) return;
  el('identityText').textContent =
    identity.serial + ' · ' + identity.model + (identity.adapter ? ' · BT 改写' : '');
  el('identityText').title = identity.adapter
    ? '蓝牙地址 ' + identity.adapter + '\n' + (identity.path || '')
    : (identity.path || '');
}

function renderWarning(text) {
  const box = el('buildWarning');
  if (!text) {
    box.style.display = 'none';
    box.textContent = '';
    return;
  }
  const html = escapeHtml(text)
    .replace(/(https?:\/\/[^\s）)]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
  box.innerHTML = html;
  box.style.display = 'block';
}

async function pollState() {
  const state = await getJson('/api/state');
  if (!state) return;
  pillState(state);
  if (state.target) {
    updateResolved(state.target);
    renderApplied(state.target);
  }
}

let lastLog = 0;

async function pollLog() {
  const data = await getJson('/api/log?since=' + lastLog);
  if (!data) return;
  lastLog = data.last;
  (data.entries || []).forEach(appendLog);
}

el('sessions').addEventListener('click', event => {
  const button = event.target.closest('button[data-remove]');
  if (button) removeSession(button.dataset.remove);
});

el('favorites').addEventListener('click', async event => {
  const button = event.target.closest('button[data-remove]');
  if (button) {
    await postJson('/api/favorites/remove', { id: button.dataset.remove });
    loadFavorites();
    return;
  }

  const row = event.target.closest('.item');
  if (!row) return;
  S.target.lat = parseFloat(row.dataset.lat);
  S.target.lon = parseFloat(row.dataset.lon);
  if (row.dataset.alt !== '') { S.target.alt = parseFloat(row.dataset.alt); el('alt').value = S.target.alt; }
  if (row.dataset.accuracy !== '') { S.target.accuracy = parseFloat(row.dataset.accuracy); el('accuracy').value = S.target.accuracy; }
  renderTarget(true);
  readInputs();
  markDirty();
  if (map) map.setView(S.datum === 'gcj' ? wgs2gcj(S.target.lat, S.target.lon) : [S.target.lat, S.target.lon], map.getZoom());
});

buildModes();
initMap();
renderTarget(true);
renderModes();
markClean();

try { logVisible = localStorage.getItem('iap2loc.showLog') === '1'; } catch (error) { logVisible = false; }
setLogVisible(logVisible);

loadDevices();
loadFavorites();
pollState();
pollLog();
setInterval(pollState, 900);
setInterval(pollLog, 1000);
</script>
</body>
</html>
