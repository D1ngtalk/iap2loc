<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iAP2 定位控制台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --surface: #f8f8f6;
    --line: #e4e3de;
    --line-strong: #cfcec8;
    --text: #1f1f1c;
    --muted: #6c6a63;
    --accent: #185fa5;
    --accent-hover: #134f8c;
    --accent-soft: #eaf2fb;
    --ok: #0f7658;
    --ok-soft: #e6f4ef;
    --warn: #b46a10;
    --warn-soft: #fdf4e4;
    --bad: #b53030;
    --bad-soft: #fbecec;
    --radius: 9px;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .08);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, .12);
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    height: 44px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    letter-spacing: -.01em;
  }
  .spacer { flex: 1; }
  .grow { flex: 1; }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .pill-btn:hover { border-color: var(--line-strong); color: var(--text); }
  .pill-btn.connected { background: var(--ok-soft); border-color: #bfe2d6; color: var(--ok); }
  .banner {
    padding: 8px 14px;
    background: var(--bad-soft);
    color: var(--bad);
    border-bottom: 1px solid #f0c9c6;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .banner a { color: var(--bad); }

  /* Buttons & Inputs */
  button, .filebtn {
    font: inherit;
    padding: 5px 11px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, opacity .15s;
  }
  button:hover:not(:disabled), .filebtn:hover { border-color: var(--line-strong); background: #fafaf8; }
  button:active:not(:disabled) { transform: translateY(.5px); }
  button:disabled { opacity: .48; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 500; }
  button.ok:hover:not(:disabled) { background: #0c6249; border-color: #0c6249; }
  button.warn { background: var(--warn-soft); border-color: #e7c894; color: var(--warn); font-weight: 500; }
  button.warn:hover:not(:disabled) { background: #faeacc; }
  button.danger { color: var(--bad); border-color: #e8c6c6; }
  button.danger:hover:not(:disabled) { background: var(--bad-soft); border-color: #dca6a6; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { background: var(--surface); color: var(--text); }
  button.mini, .filebtn.mini { padding: 3px 8px; font-size: 12px; border-radius: 7px; }
  button.xs { padding: 2px 7px; font-size: 11.5px; border-radius: 6px; }
  button.active-pill { background: var(--accent-soft); border-color: #b7d2ee; color: var(--accent); font-weight: 500; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(24, 95, 165, .42); }
    70% { box-shadow: 0 0 0 7px rgba(24, 95, 165, 0); }
    100% { box-shadow: 0 0 0 0 rgba(24, 95, 165, 0); }
  }
  button.primary.dirty { animation: pulse 1.8s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { button.primary.dirty { animation: none; } }

  input, select {
    font: inherit;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2.5px rgba(24, 95, 165, .14);
  }
  input:disabled, select:disabled { background: var(--surface); color: var(--muted); }
  input[type=checkbox] {
    flex: none;
    width: 15px;
    height: 15px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  input[type=range] {
    padding: 0;
    border: 0;
    background: transparent;
    accent-color: var(--accent);
    cursor: pointer;
    box-shadow: none !important;
  }

  /* Main layout */
  main { flex: 1; display: flex; min-height: 0; }
  #mapWrap { flex: 1; min-width: 0; position: relative; background: #eae9e4; }
  #map { width: 100%; height: 100%; }

  /* Map floating overlays */
  .map-topbar {
    position: absolute;
    z-index: 650;
    top: 12px;
    left: 52px;
    right: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    pointer-events: none;
  }
  .map-search {
    position: relative;
    flex: 1 1 180px;
    max-width: 280px;
    min-width: 160px;
    pointer-events: auto;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, .94);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 9px;
    box-shadow: var(--shadow-sm);
    padding: 2px 4px 2px 9px;
    gap: 4px;
  }
  .search-box input {
    border: 0;
    background: transparent;
    padding: 4px 2px;
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    box-shadow: none !important;
  }
  .search-box button { border: 0; background: transparent; padding: 3px 6px; color: var(--muted); font-size: 12px; }
  .search-box button:hover { color: var(--accent); background: var(--accent-soft); }
  .search-results {
    margin-top: 5px;
    background: rgba(255, 255, 255, .97);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 9px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
    max-height: 240px;
    overflow-y: auto;
  }
  .search-item {
    padding: 7px 10px;
    cursor: pointer;
    border-bottom: 1px solid #f0efe9;
    font-size: 12px;
  }
  .search-item:last-child { border-bottom: 0; }
  .search-item:hover { background: var(--accent-soft); }
  .search-item .s-title { font-weight: 500; color: var(--text); }
  .search-item .s-sub { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .map-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    margin-left: auto;
    pointer-events: auto;
  }
  .float-group {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, .94);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 9px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .float-group button {
    border: 0;
    border-radius: 0;
    background: transparent;
    padding: 5px 9px;
    font-size: 12px;
    color: var(--muted);
    border-right: 1px solid #eeede8;
  }
  .float-group button:last-child { border-right: 0; }
  .float-group button:hover { background: #f4f4f1; color: var(--text); }
  .float-group button.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

  .map-hud {
    position: absolute;
    z-index: 650;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px 6px 12px;
    max-width: calc(100% - 24px);
    background: rgba(255, 255, 255, .95);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    font-size: 12px;
    white-space: nowrap;
  }
  .map-hud > * { flex: none; white-space: nowrap; }
  .hud-metric {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto !important;
  }
  .hud-sep { color: #d0cfc9; }

  /* Sidebar */
  aside {
    width: 396px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .nav-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex: none;
  }
  .nav-tabs button {
    border: 1px solid transparent;
    background: transparent;
    padding: 5px 4px;
    font-size: 12.5px;
    color: var(--muted);
    border-radius: 7px;
    font-weight: 500;
  }
  .nav-tabs button:hover { color: var(--text); background: rgba(0, 0, 0, .03); }
  .nav-tabs button.active {
    background: var(--panel);
    border-color: var(--line);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
  }
  .tab-count {
    font-size: 10.5px;
    font-family: var(--mono);
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 0 5px;
    border-radius: 999px;
    line-height: 16px;
  }
  .nav-tabs button.active .tab-count { background: var(--accent-soft); border-color: #c5dcf3; color: var(--accent); }

  .tab-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 13px 14px;
    min-height: 0;
  }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* Cards & controls inside sidebar */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 11px;
    margin-bottom: 10px;
  }
  .card.soft { background: var(--surface); }
  .card-head {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .02em;
  }

  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    border: 0;
    border-radius: 6px;
    padding: 5px 8px;
    flex: 1;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
  }
  .seg button:hover { color: var(--text); background: rgba(0, 0, 0, .03); }
  .seg button.active {
    background: var(--panel);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .07);
  }
  .seg.compact-seg button { padding: 3.5px 6px; font-size: 12px; }

  .row { display: flex; gap: 7px; align-items: center; margin-bottom: 7px; }
  .row:last-child { margin-bottom: 0; }
  .row.wrap { flex-wrap: wrap; }
  .row > label.lbl { width: 58px; flex: none; font-size: 12px; color: var(--muted); }
  .row > input, .row > select { flex: 1; min-width: 0; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
  .field input { width: 100%; font-family: var(--mono); font-size: 12.5px; }

  .compact-num { width: 64px !important; flex: none !important; text-align: right; font-family: var(--mono); font-size: 12.5px; padding: 4px 6px; }
  .compact-num.sm { width: 54px !important; }
  .unit { font-size: 11.5px; color: var(--muted); flex: none; }
  .dash { color: var(--muted); flex: none; }
  .hint { color: var(--muted); font-size: 11.5px; margin: 0; line-height: 1.45; }

  .inline-check {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .inline-check.muted { color: var(--muted); }

  /* Badges & Dots */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 1.5px 6.5px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }
  .badge.ok { background: var(--ok-soft); border-color: #bde0d4; color: var(--ok); }
  .badge.accent { background: var(--accent-soft); border-color: #c1daf2; color: var(--accent); }
  .badge.warn { background: var(--warn-soft); border-color: #ebd0a1; color: var(--warn); }
  .badge.bad { background: var(--bad-soft); border-color: #ecc0c0; color: var(--bad); }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c5c3bc; flex: none; display: inline-block; }
  .dot.ok { background: var(--ok); }
  .dot.accent { background: var(--accent); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .dot.pulse { animation: dotPulse 1.5s ease-out infinite; }
  @keyframes dotPulse {
    0% { box-shadow: 0 0 0 0 rgba(15, 118, 88, .55); }
    70% { box-shadow: 0 0 0 5px rgba(15, 118, 88, 0); }
    100% { box-shadow: 0 0 0 0 rgba(15, 118, 88, 0); }
  }

  /* Playback Scrubber */
  .scrubber-wrap { margin: 6px 0 9px; }
  .scrubber-wrap input[type=range] { width: 100%; height: 18px; display: block; }
  .scrubber-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  .presets { display: flex; gap: 4px; flex-wrap: wrap; }
  .presets button {
    padding: 2.5px 7px;
    font-size: 11.5px;
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
  }
  .presets button:hover { color: var(--text); border-color: var(--line-strong); }
  .presets button.active { background: var(--accent-soft); border-color: #b7d2ee; color: var(--accent); font-weight: 500; }

  .gpx-banner {
    background: var(--accent-soft);
    border: 1px solid #c9def3;
    border-radius: 8px;
    padding: 7px 9px;
    margin-bottom: 8px;
  }

  .tool-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
  }
  .tool-grid > * { flex: 1 1 auto; }

  .divider { height: 1px; background: #eeede8; margin: 8px 0; }

  /* List items (devices, favorites, routes) */
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 6px;
    background: #fff;
    transition: border-color .15s, background .15s;
  }
  .item.clickable { cursor: pointer; }
  .item.clickable:hover { border-color: #b7d2ee; background: #fafcff; }
  .item .name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); font-weight: 400; margin-top: 1px; }
  .empty-state {
    text-align: center;
    padding: 14px 10px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  .readout {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
    padding: 4px 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    margin-bottom: 6px;
  }
  .readout span:first-child { color: var(--muted); flex: none; font-family: inherit; }
  .readout span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Sticky Footer */
  .aside-footer {
    flex: none;
    padding: 9px 13px 11px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .footer-status {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .footer-status .ft-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    color: var(--text);
  }
  .footer-actions { display: flex; gap: 7px; }
  .footer-actions button.primary { flex: 1; padding: 7px 12px; font-size: 13px; }

  /* Logs */
  #log {
    height: 220px;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #1d1d1b;
    color: #d8d6cf;
    overflow: auto;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  #log div { white-space: pre-wrap; word-break: break-all; }
  #log .t { color: #7d7a72; }
  #log .ok { color: #7fd1a8; }
  #log .error { color: #f0a3a3; }
  #log .warn { color: #e8c27a; }
  #log .step { color: #9cc4ea; }
  body.log-hidden #log { display: none; }

  /* Map custom markers */
  .mapnote {
    position: absolute;
    z-index: 500;
    left: 12px;
    bottom: 12px;
    background: rgba(255, 255, 255, .94);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .wp span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
  }
  .wp.wp-start span { background: var(--ok); }
  .wp.wp-end span { background: #c77710; }
  .wp.wp-locked span { opacity: .82; }

  .live-pos-icon { background: transparent; border: 0; overflow: visible !important; }
  .live-pos-wrap {
    position: relative;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .live-pos-halo {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: rgba(24, 95, 165, .22);
    animation: liveRipple 2s ease-out infinite;
  }
  .live-pos-wrap.paused .live-pos-halo { background: rgba(180, 106, 16, .2); animation: none; }
  @keyframes liveRipple {
    0% { transform: scale(.75); opacity: .9; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  .live-pos-arrow {
    position: absolute;
    inset: 0;
    transition: transform .25s linear;
  }
  .live-pos-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2.5px solid #fff;
    box-shadow: 0 1px 5px rgba(0, 0, 0, .4);
    position: relative;
    z-index: 2;
  }
  .live-pos-wrap.paused .live-pos-dot { background: var(--warn); }
  .live-pos-tag {
    position: absolute;
    top: 31px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 1.5px 7px;
    border-radius: 999px;
    background: rgba(24, 95, 165, .93);
    color: #fff;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.35;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .24);
    border: 1px solid rgba(255, 255, 255, .9);
    pointer-events: none;
  }
  .live-pos-wrap.paused .live-pos-tag { background: rgba(180, 106, 16, .93); }

  /* Current modified device position card */

<script>
/* ---------- coordinate transforms ---------- */
const PI = Math.PI, AXIS = 6378245.0, EE = 0.00669342162296594323;
function outOfChina(lat, lon) { return !(lon > 73.66 && lon < 135.05 && lat > 3.86 && lat < 53.55); }
function transformLat(x, y) {
  let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
  r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
  return r;
}
function transformLon(x, y) {
  let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
  r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
  return r;
}
function wgs2gcj(lat, lon) {
  if (outOfChina(lat, lon)) return [lat, lon];
  let dLat = transformLat(lon - 105, lat - 35), dLon = transformLon(lon - 105, lat - 35);
  const radLat = lat / 180 * PI;
  let magic = Math.sin(radLat); magic = 1 - EE * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((AXIS * (1 - EE)) / (magic * sq) * PI);
  dLon = (dLon * 180) / (AXIS / sq * Math.cos(radLat) * PI);
  return [lat + dLat, lon + dLon];
}
function gcj2wgs(lat, lon) {
  let wLat = lat, wLon = lon;
  for (let i = 0; i < 8; i++) {
    const [gLat, gLon] = wgs2gcj(wLat, wLon);
    wLat += lat - gLat; wLon += lon - gLon;
  }
  return [wLat, wLon];
}

  { id: 'point', label: '单点定位' },

const AUTO_CLOSE_METERS = 50.0;

const S = {

  pathTimeScale: 1,

  followLive: false,
  rate: 250, identity: '', transport: 'bt', host: '127.0.0.1', port: 8738,
  datum: 'wgs',
  sessions: [], devices: [], favorites: [], savedRoutes: [],
  serverTarget: null,

  hasInitialSync: false,

let map = null, marker = null, jitterCircle = null;
let routeLine = null, closingLine = null, closeGuideCircle = null, routeLayer = null;
let liveMarker = null, liveMarkerKey = '', osmLayer = null, amapLayer = null;

let routeDirty = false;

function getCurrentDevicePoint(target = S.serverTarget) {
  if (target) {
    if (Number.isFinite(target.currentLatitude) && Number.isFinite(target.currentLongitude)) {
      return { lat: target.currentLatitude, lon: target.currentLongitude };
    }
    if (Number.isFinite(target.resolvedLatitude) && Number.isFinite(target.resolvedLongitude)) {
      return { lat: target.resolvedLatitude, lon: target.resolvedLongitude };
    }
    if (Number.isFinite(target.latitude) && Number.isFinite(target.longitude)) {
      return { lat: target.latitude, lon: target.longitude };
    }
  }
  return { lat: S.target.lat, lon: S.target.lon };
}

function clampLat(lat) { return Math.max(-90, Math.min(90, lat)); }
function wrapLon(lon) { return ((lon + 180) % 360 + 360) % 360 - 180; }
function toLatLng(point) {
  const [lat, lon] = S.datum === 'gcj' ? wgs2gcj(point.lat, point.lon) : [point.lat, point.lon];
  return [lat, lon];
}
function fromMapLatLng(lat, lon) {
  const [wLat, wLon] = S.datum === 'gcj' ? gcj2wgs(lat, lon) : [lat, lon];
  return [clampLat(wLat), wrapLon(wLon)];
}
function distanceMeters(a, b) {
  const radius = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * radius * Math.asin(Math.min(1, Math.sqrt(h)));
}
function formatDistance(meters) {
  if (!Number.isFinite(meters) || meters <= 0) return '0 m';
  return meters >= 1000 ? (meters / 1000).toFixed(2) + ' km' : Math.round(meters) + ' m';
}
function formatDuration(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
  const total = Math.round(seconds);
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const rest = total % 60;
  const pad = value => String(value).padStart(2, '0');
  return hours > 0 ? hours + ':' + pad(minutes) + ':' + pad(rest) : pad(minutes) + ':' + pad(rest);
}
function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function getClosureInfo(points = S.route, autoClose = S.pathAutoClose) {
  if (!points || points.length < 2) return { closed: false, autoClosed: false, gap: 0 };
  const gap = distanceMeters(points[points.length - 1], points[0]);
  if (points.length < 3) return { closed: false, autoClosed: false, gap };
  if (gap <= 0.5) return { closed: true, autoClosed: false, gap };
  if (autoClose && gap < AUTO_CLOSE_METERS) return { closed: true, autoClosed: true, gap };
  return { closed: false, autoClosed: false, gap };
}

function routeLength(points = S.route, autoClose = S.pathAutoClose) {
  let total = 0;
  for (let i = 1; i < points.length; i++) total += distanceMeters(points[i - 1], points[i]);
  const closure = getClosureInfo(points, autoClose);
  if (closure.autoClosed) total += closure.gap;
  return total;
}

function routeDuration(points = S.route) {
  if (points.length < 2 || !points.every(p => p.time != null)) return 0;
  const span = (points[points.length - 1].time - points[0].time) / 1000;
  return span > 0 ? span : 0;
}

function isPathLiveOnServer() {
  return !!(S.serverTarget && S.serverTarget.mode === 'path' && S.serverTarget.routePoints >= 2 && !routeDirty);
}

function initMap() {
  if (typeof L === 'undefined') {
    el('map').innerHTML = '<div class="mapnote">地图资源未加载（离线或 CDN 不可达）。坐标与路径仍可通过面板管理。</div>';

  amapLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    { subdomains: '1234', maxZoom: 18, attribution: '&copy; 高德地图' });

  });

    }

}

function pushRouteHistory() {
  S.routeHistory.push(S.route.map(p => ({ ...p })));
  if (S.routeHistory.length > 40) S.routeHistory.shift();
}

async function addOnMap(lat, lon) {
  const [wLat, wLon] = fromMapLatLng(lat, lon);
  const newPoint = { lat: +wLat.toFixed(6), lon: +wLon.toFixed(6), alt: null, time: null };

  if (S.mode === 'path') {
    if (!S.routeEditing) {
      notify('当前处于防误触锁定状态，点击「编辑」即可继续添加途径点');
      return;
    }
    if (S.snappingBusy) return;

    pushRouteHistory();
    S.route.forEach(p => { p.time = null; });

    if (S.snapRoad && S.route.length >= 1) {
      const prev = S.route[S.route.length - 1];
      const snapped = await fetchOsrmSegment(prev, newPoint, S.snapProfile);
      if (snapped && snapped.length >= 2) {
        for (let i = 1; i < snapped.length; i++) S.route.push(snapped[i]);
      } else {
        S.route.push(newPoint);
      }
    } else {
      S.route.push(newPoint);
    }

    const closure = getClosureInfo();
    if (closure.autoClosed) {
      notify('终起点相距 ' + Math.round(closure.gap) + 'm（<50m），已自动闭合路线', 'ok');
    }

    renderRoute();
    markDirty(true);
    return;
  }

  applyPicked(wLat, wLon);
}

async function fetchOsrmSegment(from, to, profile) {
  S.snappingBusy = true;
  el('snapStatus').textContent = '贴路计算中…';
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  try {
    const osrmProfile = profile === 'driving' ? 'driving' : (profile === 'bike' ? 'bike' : 'foot');
    const url = 'https://router.project-osrm.org/route/v1/' + osrmProfile + '/' +
      from.lon.toFixed(6) + ',' + from.lat.toFixed(6) + ';' +
      to.lon.toFixed(6) + ',' + to.lat.toFixed(6) + '?overview=full&geometries=geojson';
    const resp = await fetch(url, { signal: controller.signal });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const coords = data && data.routes && data.routes[0] && data.routes[0].geometry && data.routes[0].geometry.coordinates;
    if (!Array.isArray(coords) || coords.length < 2) return null;

    // Simplify dense OSRM vertices slightly (min 6m spacing) while keeping start/end exact
    const result = [];
    let last = null;
    for (let i = 0; i < coords.length; i++) {
      const pt = { lat: +clampLat(coords[i][1]).toFixed(6), lon: +wrapLon(coords[i][0]).toFixed(6), alt: null, time: null };
      if (!last || i === coords.length - 1 || distanceMeters(last, pt) >= 6) {
        result.push(pt);
        last = pt;
      }
    }
    return result;
  } catch (err) {
    notify('在线贴路不可达，已按直线连接', 'error');
    return null;
  } finally {
    clearTimeout(timer);
    S.snappingBusy = false;
    el('snapStatus').textContent = '';
  }
}

function applyPicked(lat, lon) {
  const nextLat = +clampLat(lat).toFixed(6);
  const nextLon = +wrapLon(lon).toFixed(6);
  S.target.lat = nextLat;
  S.target.lon = nextLon;
  renderTarget(true);
  readInputs();
  markDirty(false);
}

function renderTarget(updateInputs) {
  const chipPt = S.mode === 'path' ? getCurrentDevicePoint(S.serverTarget) : { lat: S.target.lat, lon: S.target.lon };
  const [gLat, gLon] = wgs2gcj(chipPt.lat, chipPt.lon);
  el('chipWgs').textContent = chipPt.lat.toFixed(6) + ', ' + chipPt.lon.toFixed(6);
  el('chipGcj').textContent = gLat.toFixed(6) + ', ' + gLon.toFixed(6);
  if (updateInputs) {
    el('lat').value = S.target.lat.toFixed(6);
    el('lon').value = S.target.lon.toFixed(6);
  }

}

function renderJitterCircle(latlng) {

  if (S.mode === 'point' && S.target.jitterMeters > 0) {

function setDatum(next) {
  if (next === S.datum) return;
  const centerWgs = map ? fromMapLatLng(map.getCenter().lat, map.getCenter().lng) : [S.target.lat, S.target.lon];
  S.datum = next;
  document.querySelectorAll('#datum button').forEach(b => b.classList.toggle('active', b.dataset.datum === next));
  if (map) {
    if (next === 'gcj') { map.removeLayer(osmLayer); amapLayer.addTo(map); }
    else { map.removeLayer(amapLayer); osmLayer.addTo(map); }
    const [gLat, gLon] = wgs2gcj(centerWgs[0], centerWgs[1]);
    map.setView(next === 'gcj' ? [gLat, gLon] : centerWgs, map.getZoom(), { animate: false });
  }
  renderTarget(false);
  renderRoute();
  updateLiveMarker(S.serverTarget, false);
}

/* ---------- route rendering & editing ---------- */
function waypointIcon(label, kind, locked) {
  const cls = 'wp' + (kind ? ' wp-' + kind : '') + (locked ? ' wp-locked' : '');
  return L.divIcon({ className: cls, html: '<span>' + label + '</span>', iconSize: [20, 20], iconAnchor: [10, 10] });
}

function closestSegmentIndex(points, target) {
  let bestIdx = 0, bestDist = Infinity;
  const cosLat = Math.cos(target.lat * Math.PI / 180);
  for (let i = 0; i < points.length - 1; i++) {
    const ax = points[i].lon * cosLat, ay = points[i].lat;
    const bx = points[i + 1].lon * cosLat, by = points[i + 1].lat;
    const px = target.lon * cosLat, py = target.lat;
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    const t = lenSq > 0 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq)) : 0;
    const cx = ax + t * dx, cy = ay + t * dy;
    const d = (px - cx) ** 2 + (py - cy) ** 2;
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  return bestIdx;
}

function renderRoute() {
  if (map) {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (closingLine) { map.removeLayer(closingLine); closingLine = null; }
    if (closeGuideCircle) { map.removeLayer(closeGuideCircle); closeGuideCircle = null; }
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  }

  if (map && S.mode === 'path' && S.route.length > 0) {
    const points = S.route.map(toLatLng);
    const closure = getClosureInfo();

    // 50m guide ring around point #1 while editing
    if (S.routeEditing && S.pathAutoClose && S.route.length >= 2) {
      closeGuideCircle = L.circle(points[0], {
        radius: AUTO_CLOSE_METERS,
        color: '#0f7658',
        weight: 1.2,
        dashArray: '4, 4',
        fillColor: '#0f7658',
        fillOpacity: closure.autoClosed ? 0.11 : 0.05,
        interactive: false
      }).addTo(map);
    }

    if (points.length >= 2) {
      routeLine = L.polyline(points, {
        color: '#185fa5',
        weight: 3.5,
        opacity: 0.92,
        lineJoin: 'round',
        lineCap: 'round'
      }).addTo(map);

      // Click polyline to insert midpoint when editing manageable routes
      if (S.routeEditing && S.route.length <= 200) {
        routeLine.on('click', event => {
          L.DomEvent.stopPropagation(event);
          const [wLat, wLon] = fromMapLatLng(event.latlng.lat, event.latlng.lng);
          const inserted = { lat: +wLat.toFixed(6), lon: +wLon.toFixed(6), alt: null, time: null };
          const segIndex = closestSegmentIndex(S.route, inserted);
          pushRouteHistory();
          S.route.forEach(p => { p.time = null; });
          S.route.splice(segIndex + 1, 0, inserted);
          renderRoute();
          markDirty(true);
          notify('已在第 ' + (segIndex + 1) + '–' + (segIndex + 2) + ' 点之间插入途径点');
        });
      }
    }

    // Dashed closing edge when <50m auto-close is active
    if (closure.autoClosed) {
      closingLine = L.polyline([points[points.length - 1], points[0]], {
        color: '#0f7658',
        weight: 3.5,
        dashArray: '6, 6',
        opacity: 0.92,
        interactive: false
      }).addTo(map);
    }

    routeLayer = L.layerGroup();
    const dense = S.route.length > 80;
    const indices = dense ? [0, S.route.length - 1] : S.route.map((_, i) => i);

    indices.forEach(index => {
      const isStart = index === 0;
      const isEnd = index === S.route.length - 1 && S.route.length > 1;
      const kind = isStart ? 'start' : (isEnd ? 'end' : '');
      const label = dense ? (isStart ? '起' : '终') : String(index + 1);
      const node = L.marker(points[index], {
        draggable: S.routeEditing && !dense,
        icon: waypointIcon(label, kind, !S.routeEditing),
        zIndexOffset: isStart ? 300 : (isEnd ? 250 : 100)
      });

      if (S.routeEditing && !dense) {
        node.on('dragend', () => {
          const pos = node.getLatLng();
          const [wLat, wLon] = fromMapLatLng(pos.lat, pos.lng);
          pushRouteHistory();
          S.route[index] = { ...S.route[index], lat: +wLat.toFixed(6), lon: +wLon.toFixed(6) };
          renderRoute();
          markDirty(true);
        });
        node.on('contextmenu', event => {
          L.DomEvent.preventDefault(event.originalEvent || event);
          pushRouteHistory();
          S.route.splice(index, 1);
          renderRoute();
          markDirty(true);
        });
      }
      routeLayer.addLayer(node);
    });
    routeLayer.addTo(map);
  }

  renderRouteInfo();
  renderPathUi();
  renderDeviceLocationCard(S.serverTarget);
  updateLiveMarker(S.serverTarget, false);
}

function renderRouteInfo() {
  const count = S.route.length;
  const len = routeLength();
  const duration = routeDuration();
  const closure = getClosureInfo();

  el('routeUndo').disabled = S.routeHistory.length === 0 && count === 0;
  el('routeClear').disabled = count === 0;
  el('routeSave').disabled = count < 2;
  el('routeExport').disabled = count < 2;
  el('btnReverse').disabled = count < 2;

  if (count === 0) {
    el('routeInfo').textContent = '未添加';
    el('closureGapText').textContent = '';
  } else {
    el('routeInfo').textContent = count + ' 点 · ' + formatDistance(len);
    if (count >= 3) {
      if (closure.autoClosed) {
        el('closureGapText').textContent = '首尾 ' + Math.round(closure.gap) + 'm · 已自动闭合';
        el('closureGapText').style.color = 'var(--ok)';
      } else if (closure.closed) {
        el('closureGapText').textContent = '首尾已重合闭合';
        el('closureGapText').style.color = 'var(--ok)';
      } else {
        el('closureGapText').textContent = '首尾相距 ' + formatDistance(closure.gap);
        el('closureGapText').style.color = '';
      }
    } else {
      el('closureGapText').textContent = count === 2 ? '需 ≥ 3 点闭合' : '';
      el('closureGapText').style.color = '';
    }
  }

  // GPX timing controls
  const hasGpxTime = duration > 0;
  el('gpxTimeBox').style.display = hasGpxTime ? '' : 'none';
  if (hasGpxTime) {
    el('gpxDurationLabel').textContent = '原时长 ' + formatDuration(duration);
    el('gpxScaleRow').style.display = S.pathUseGpxTime ? 'flex' : 'none';
  }
  const speedLocked = hasGpxTime && S.pathUseGpxTime;
  el('speedControls').style.opacity = speedLocked ? '.48' : '1';
  el('pathSpeed').disabled = speedLocked;
  el('pathSpeedJitter').disabled = speedLocked;
  el('speedPresets').querySelectorAll('button').forEach(b => { b.disabled = speedLocked; });

  el('routeEditHint').textContent = count > 80
    ? '轨迹点较多（' + count + ' 点），仅显示起终点标记以保证流畅'
    : (S.routeEditing
      ? '点地图加点 · 点线段插点 · 拖序号微调 · 右键删点'
      : '地图已锁定防误触 · 点击右上「锁定」按钮可恢复编辑');
}

function setRouteEditing(next) {
  S.routeEditing = next;
  const btn = el('toggleEditBtn');
  btn.textContent = next ? '✎ 编辑中' : '🔒 已锁定';
  btn.classList.toggle('active-pill', next);
  el('hudEditBtn').textContent = next ? '编辑中' : '已锁定';
  el('hudEditBtn').classList.toggle('active-pill', next);
  renderRoute();
}
el('toggleEditBtn').addEventListener('click', () => setRouteEditing(!S.routeEditing));
el('hudEditBtn').addEventListener('click', () => setRouteEditing(!S.routeEditing));

/* ---------- current device location card & start-from-device ---------- */
function renderDeviceLocationCard(target = S.serverTarget) {
  const pt = getCurrentDevicePoint(target);
  const coordEl = el('devicePosCoord');
  const dotEl = el('devicePosDot');
  const badgeEl = el('devicePosBadge');
  const subEl = el('devicePosSub');
  const useStartBtn = el('deviceUseAsStart');
  const syncTargetBtn = el('syncDeviceToTarget');

  coordEl.textContent = pt.lat.toFixed(6) + ', ' + pt.lon.toFixed(6);

  if (S.mode === 'path') {
    const [gLat, gLon] = wgs2gcj(pt.lat, pt.lon);
    el('chipWgs').textContent = pt.lat.toFixed(6) + ', ' + pt.lon.toFixed(6);
    el('chipGcj').textContent = gLat.toFixed(6) + ', ' + gLon.toFixed(6);
  }

  if (!target) {
    dotEl.className = 'dot';
    badgeEl.className = 'badge';
    badgeEl.textContent = '等待同步';
  } else if (target.mode === 'path' && target.routePoints >= 2) {
    if (target.pathReachedEnd) {
      dotEl.className = 'dot accent';
      badgeEl.className = 'badge accent';
      badgeEl.textContent = '已到达终点';
    } else if (target.pathPaused) {
      dotEl.className = 'dot warn';
      badgeEl.className = 'badge warn';
      badgeEl.textContent = '路径已暂停';
    } else {
      dotEl.className = 'dot ok pulse';
      badgeEl.className = 'badge ok';
      badgeEl.textContent = '移动中 · ' + (target.pathCurrentSpeedMps * 3.6).toFixed(1) + ' km/h';
    }
  } else {
    dotEl.className = 'dot ok';
    badgeEl.className = 'badge accent';
    badgeEl.textContent = '单点生效中';
  }

  useStartBtn.style.display = S.mode === 'path' ? '' : 'none';
  const distToDraft = distanceMeters(pt, { lat: S.target.lat, lon: S.target.lon });
  syncTargetBtn.style.display = S.mode === 'point' && distToDraft >= 1.0 ? '' : 'none';

  if (S.mode === 'point' && distToDraft >= 1.0) {
    subEl.style.display = '';
    subEl.textContent = '与下方待应用目标相距 ' + formatDistance(distToDraft);
  } else if (S.mode === 'path' && S.route.length >= 1) {
    const distToStart = distanceMeters(pt, S.route[0]);
    subEl.style.display = '';
    subEl.textContent = distToStart < 1.0
      ? '已与路线起点重合'
      : '距当前路线起点 ' + formatDistance(distToStart);
  } else {
    subEl.style.display = 'none';
    subEl.textContent = '';
  }
}

async function useDeviceLocationAsRouteStart() {
  if (S.snappingBusy) return;
  if (S.mode !== 'path') {
    setMode('path');
  }
  const pt = getCurrentDevicePoint(S.serverTarget);
  const startPt = { lat: +clampLat(pt.lat).toFixed(6), lon: +wrapLon(pt.lon).toFixed(6), alt: null, time: null };

  if (S.route.length === 0) {
    pushRouteHistory();
    S.route.push(startPt);
    S.routeEditing = true;
    el('toggleEditBtn').textContent = '✎ 编辑中';
    el('toggleEditBtn').classList.add('active-pill');
    el('hudEditBtn').textContent = '编辑中';
    el('hudEditBtn').classList.add('active-pill');
    renderRoute();
    markDirty(true);
    if (map) {
      const ll = toLatLng(startPt);
      if (!map.getBounds().contains(ll)) map.setView(ll, Math.max(map.getZoom(), 15));
    }
    notify('已将当前设备位置设为起点，继续点击地图添加后续路径点', 'ok');
    return;
  }

  if (distanceMeters(startPt, S.route[0]) < 1.0) {
    notify('起点已是当前设备位置');
    return;
  }

  pushRouteHistory();
  S.route.forEach(p => { p.time = null; });

  if (S.snapRoad) {
    const snapped = await fetchOsrmSegment(startPt, S.route[0], S.snapProfile);
    if (snapped && snapped.length >= 2) {
      S.route = [...snapped.slice(0, -1), ...S.route];
    } else {
      S.route.unshift(startPt);
    }
  } else {
    S.route.unshift(startPt);
  }

  const closure = getClosureInfo();
  renderRoute();
  markDirty(true);
  if (closure.autoClosed) {
    notify('已将当前设备位置设为起点，终起点相距 ' + Math.round(closure.gap) + 'm（<50m）已自动闭合', 'ok');
  } else {
    notify('已将当前设备位置插入为路线起点（共 ' + S.route.length + ' 点）', 'ok');
  }
}

/* ---------- live current device marker ---------- */
function createLiveIcon(bearing, paused, tagText) {
  const angle = Number.isFinite(bearing) ? bearing : 0;
  const showArrow = Number.isFinite(bearing);
  const arrowSvg = showArrow
    ? '<svg class="live-pos-arrow" viewBox="0 0 34 34" style="transform:rotate(' + angle.toFixed(1) + 'deg)">' +
        '<path d="M17 0.5 L23 11.5 L17 9 L11 11.5 Z" fill="' + (paused ? '#b46a10' : '#185fa5') + '" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>' +
      '</svg>'
    : '';
  const tagHtml = tagText ? '<div class="live-pos-tag">' + escapeHtml(tagText) + '</div>' : '';
  return L.divIcon({
    className: 'live-pos-icon',
    html: '<div class="live-pos-wrap' + (paused ? ' paused' : '') + '">' +
            '<div class="live-pos-halo"></div>' +
            arrowSvg +
            '<div class="live-pos-dot"></div>' +
            tagHtml +
          '</div>',
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
}

function updateLiveMarker(target, allowPan = true) {
  if (!map) return;

  const pt = getCurrentDevicePoint(target);
  const latlng = toLatLng(pt);
  const isServerPath = !!(target && target.mode === 'path' && target.routePoints >= 2);
  const paused = isServerPath && (!!target.pathPaused || !!target.pathReachedEnd);
  const bearing = isServerPath && Number.isFinite(target.currentBearing) ? target.currentBearing : null;

  let tagText = '';
  let zIndex = 600;
  const overlapsStart = S.mode === 'path' && S.route.length >= 1 && distanceMeters(pt, S.route[0]) < 1.0;
  if (isServerPath) {
    tagText = (S.mode === 'point' || routeDirty) ? '当前修改位置' : '';
    zIndex = (routeDirty && overlapsStart) ? 200 : 600;
  } else if (S.mode === 'path') {
    tagText = '当前位置';
    zIndex = overlapsStart ? 200 : 600;
  } else {
    const diff = distanceMeters(pt, { lat: S.target.lat, lon: S.target.lon });
    tagText = diff >= 1.0 ? '当前修改位置' : '';
    zIndex = diff >= 1.0 ? 600 : 200;
  }

  const nextKey = (paused ? '1' : '0') + '|' + (bearing !== null ? '1' : '0') + '|' + tagText;

  if (!liveMarker) {
    liveMarkerKey = nextKey;
    liveMarker = L.marker(latlng, {
      icon: createLiveIcon(bearing, paused, tagText),
      interactive: false,
      zIndexOffset: zIndex
    }).addTo(map);
  } else {
    liveMarker.setLatLng(latlng);
    liveMarker.setZIndexOffset(zIndex);
    if (!map.hasLayer(liveMarker)) liveMarker.addTo(map);
    if (nextKey !== liveMarkerKey) {
      liveMarkerKey = nextKey;
      liveMarker.setIcon(createLiveIcon(bearing, paused, tagText));
    } else if (bearing !== null) {
      const root = liveMarker.getElement();
      const arrow = root && root.querySelector('.live-pos-arrow');
      if (arrow) {
        arrow.style.transform = 'rotate(' + bearing.toFixed(1) + 'deg)';
      }
    }
  }

  if (allowPan && S.followLive && !S.mapDragging && isServerPath && !paused) {
    map.panTo(latlng, { animate: true, duration: 0.45 });
  }
}

/* ---------- path playback UI & HUD ---------- */
function renderPathUi() {
  const t = S.serverTarget;
  const live = isPathLiveOnServer();
  const hasRoute = S.route.length >= 2;
  const closure = live ? { closed: t.routeClosed, autoClosed: t.routeAutoClosed } : getClosureInfo();

  const totalLen = live ? t.routeLengthMeters : routeLength();
  const travelled = live ? t.pathTravelledMeters : 0;
  const pct = totalLen > 0 ? Math.max(0, Math.min(1, travelled / totalLen)) : 0;
  const currentKmh = live ? (t.pathCurrentSpeedMps * 3.6) : 0;

  // State badge & Play/Pause button
  const badge = el('pathStateBadge');
  const dot = el('pathStateDot');
  const txt = el('pathStateText');
  const playBtn = el('btnPlayPause');
  const hud = el('mapHud');
  const hudDot = el('hudDot');
  const hudStatus = el('hudStatus');
  const hudMetric = el('hudMetric');
  const hudPlay = el('hudPlayBtn');

  hud.style.display = S.mode === 'path' ? 'flex' : 'none';
  el('pathClosedBadge').style.display = closure.closed ? '' : 'none';
  el('hudClosedBadge').style.display = closure.closed ? '' : 'none';
  el('hudUseStartBtn').style.display = S.mode === 'path' && S.route.length === 0 ? '' : 'none';

  el('btnRestart').disabled = !live;
  el('pathScrubber').disabled = !live;
  playBtn.disabled = !hasRoute;

  if (!hasRoute) {
    badge.className = 'badge';
    dot.className = 'dot';
    txt.textContent = S.route.length === 1 ? '还需 1 个点' : '未添加路径';
    playBtn.className = 'primary';
    playBtn.textContent = '▶ 开始移动';
    el('pathLapBadge').style.display = 'none';
    el('pathEtaText').textContent = '—';
    el('liveSpeedHint').textContent = '';

    hudDot.className = 'dot';
    hudStatus.textContent = '画线模式';
    hudMetric.textContent = S.route.length === 1 ? '已点起点，继续点地图添加下一点' : '点击地图依次添加路径点';
    hudPlay.style.display = 'none';
  } else if (!live) {
    badge.className = 'badge warn';
    dot.className = 'dot warn';
    txt.textContent = '待开始';
    playBtn.className = 'primary';
    playBtn.textContent = '▶ 开始移动';
    el('pathLapBadge').style.display = 'none';
    const estSec = S.pathUseGpxTime && routeDuration() > 0
      ? routeDuration() / S.pathTimeScale
      : (S.pathSpeed > 0 ? totalLen / (S.pathSpeed / 3.6) : 0);
    el('pathEtaText').textContent = '预计 ' + formatDuration(estSec);
    el('liveSpeedHint').textContent = '';

    hudDot.className = 'dot warn';
    hudStatus.textContent = '待启动';
    hudMetric.textContent = S.route.length + ' 点 · ' + formatDistance(totalLen) + ' · 预计 ' + formatDuration(estSec);
    hudPlay.style.display = '';
    hudPlay.className = 'mini primary';
    hudPlay.textContent = '▶ 开始';
  } else {
    const paused = !!t.pathPaused;
    const ended = !!t.pathReachedEnd;
    const lapText = t.pathLoopMode === 'pingPong'
      ? (t.pathReversed ? '返程 · 第 ' + t.pathLap + ' 趟' : '去程 · 第 ' + t.pathLap + ' 趟')
      : ('第 ' + t.pathLap + ' 圈');
    el('pathLapBadge').style.display = t.pathLoopMode === 'once' ? 'none' : '';
    el('pathLapBadge').textContent = lapText;

    // ETA calculation
    const remainingMeters = t.pathReversed ? travelled : Math.max(0, totalLen - travelled);
    const nominalMps = t.pathTimed && t.pathUseGpxTime
      ? (t.pathDurationSeconds > 0 ? (t.routeLengthMeters / t.pathDurationSeconds) * t.pathTimeScale : 1)
      : Math.max(0.1, t.pathSpeedMps);
    const etaSec = ended ? 0 : remainingMeters / Math.max(0.1, nominalMps);
    const etaLabel = ended ? '已到达' : ('剩 ' + formatDuration(etaSec));
    el('pathEtaText').textContent = (paused ? '0.0 km/h' : currentKmh.toFixed(1) + ' km/h') + ' · ' + etaLabel;
    const targetKmh = t.pathSpeedMps * 3.6;
    const speedDelta = targetKmh - currentKmh;
    if (!paused && !ended && !(t.pathTimed && t.pathUseGpxTime) && Math.abs(speedDelta) >= 0.4) {
      el('liveSpeedHint').textContent = (speedDelta > 0 ? '加速中 ' : '减速中 ') + currentKmh.toFixed(1) + ' km/h';
    } else if (!paused && !ended && t.pathSpeedJitterPercent > 0) {
      el('liveSpeedHint').textContent = '实时 ' + currentKmh.toFixed(1) + ' km/h';
    } else {
      el('liveSpeedHint').textContent = '';
    }

    if (ended) {
      badge.className = 'badge accent';
      dot.className = 'dot accent';
      txt.textContent = '已到达终点';
      playBtn.className = 'primary';
      playBtn.textContent = '↺ 重新开始';

      hudDot.className = 'dot accent';
      hudStatus.textContent = '已到达';
      hudPlay.style.display = '';
      hudPlay.className = 'mini primary';
      hudPlay.textContent = '↺ 重跑';
    } else if (paused) {
      badge.className = 'badge warn';
      dot.className = 'dot warn';
      txt.textContent = '已暂停';
      playBtn.className = 'ok';
      playBtn.textContent = '▶ 继续移动';

      hudDot.className = 'dot warn';
      hudStatus.textContent = '已暂停';
      hudPlay.style.display = '';
      hudPlay.className = 'mini ok';
      hudPlay.textContent = '▶ 继续';
    } else {
      badge.className = 'badge ok';
      dot.className = 'dot ok pulse';
      txt.textContent = '移动中';
      playBtn.className = 'warn';
      playBtn.textContent = '⏸ 暂停移动';

      hudDot.className = 'dot ok pulse';
      hudStatus.textContent = currentKmh.toFixed(1) + ' km/h';
      hudPlay.style.display = '';
      hudPlay.className = 'mini warn';
      hudPlay.textContent = '⏸ 暂停';
    }

    hudMetric.textContent = formatDistance(travelled) + ' / ' + formatDistance(totalLen) + ' · ' + etaLabel;
  }

  if (!S.scrubberDragging) {
    el('pathScrubber').value = String(Math.round(pct * 1000));
    el('scrubLeft').textContent = formatDistance(travelled);
    el('scrubPct').textContent = Math.round(pct * 100) + '%';
    el('scrubRight').textContent = formatDistance(totalLen);
  }
}

/* ---------- instant path control API ---------- */
let stateMutationSeq = 0;
async function sendPathControl(body) {
  const seq = ++stateMutationSeq;
  const result = await postJson('/api/path/control', body);
  if (result && result.ok && result.target) {
    if (seq >= stateMutationSeq) {
      S.serverTarget = result.target;
      renderApplied(result.target);
      renderPathUi();
      updateLiveMarker(result.target, false);
    }
    return true;
  }
  if (result && result.error) notify(result.error, 'error');
  return false;
}

async function handlePlayPause() {
  if (S.route.length < 2) {
    notify('请先在地图上添加至少 2 个路径点，或导入 GPX', 'error');
    return;
  }
  if (!isPathLiveOnServer()) {
    const ok = await applyTarget({ pathPaused: false });
    if (ok) {
      setRouteEditing(false);
      notify('已开始沿路径移动', 'ok');
    }
    return;
  }
  const t = S.serverTarget;
  if (t.pathReachedEnd) {
    await sendPathControl({ action: 'restart' });
    await sendPathControl({ action: 'resume' });
    notify('已回到起点重新移动', 'ok');
    return;
  }
  if (t.pathPaused) {
    await sendPathControl({ action: 'resume' });
    notify('已继续移动', 'ok');
  } else {
    await sendPathControl({ action: 'pause' });
    notify('已暂停移动（原地保持当前坐标，速度归零）');
  }
}
el('btnPlayPause').addEventListener('click', handlePlayPause);
el('hudPlayBtn').addEventListener('click', handlePlayPause);

el('btnRestart').addEventListener('click', async () => {

/* ---------- speed, loop mode, auto-close, GPX scale controls ---------- */
let liveParamTimer = null;
let pendingLivePatch = {};
function scheduleLiveParamSync(payload, delayMs = 240) {
  if (!isPathLiveOnServer()) {
    markDirty(false);
    return;
  }
  pendingLivePatch = { ...pendingLivePatch, ...payload };
  clearTimeout(liveParamTimer);
  liveParamTimer = setTimeout(() => {
    const patch = pendingLivePatch;
    pendingLivePatch = {};
    liveParamTimer = null;
    sendPathControl(patch);
  }, delayMs);
}

function flushLiveParamSync(overridePatch) {
  clearTimeout(liveParamTimer);
  liveParamTimer = null;
  const patch = { ...pendingLivePatch, ...overridePatch };
  pendingLivePatch = {};
  sendPathControl(patch);
}

/* ---------- route undo / clear / import / export ---------- */
function undoRoute() {
  if (S.routeHistory.length > 0) {
    S.route = S.routeHistory.pop();
  } else if (S.route.length > 0) {
    S.route.pop();
  } else {
    return;
  }
  renderRoute();
  markDirty(true);
}
el('routeUndo').addEventListener('click', undoRoute);

el('routeClear').addEventListener('click', () => {
  if (S.route.length === 0) return;
  if (!confirm('确定清空当前整条路径？')) return;
  pushRouteHistory();
  S.route = [];
  setRouteEditing(true);
  renderRoute();
  markDirty(true);
});

el('gpxFile').addEventListener('change', async event => {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;

  let points = [];
  try { points = parseGpx(await file.text()); } catch (e) { points = []; }
  if (points.length < 2) {
    notify('这个 GPX 里没有可用的轨迹点（至少需要 2 个）', 'error');
    return;
  }

  pushRouteHistory();
  S.route = downsample(points, 5000);
  S.pathUseGpxTime = routeDuration(S.route) > 0;
  el('pathUseGpxTime').checked = S.pathUseGpxTime;
  if (S.mode !== 'path') S.mode = 'path';
  S.routeEditing = false;
  renderModes();
  setRouteEditing(false);
  fitView();
  markDirty(true);

  const dur = routeDuration();
  const closure = getClosureInfo();
  notify('已导入 ' + S.route.length + ' 点 · ' + formatDistance(routeLength()) +
    (dur > 0 ? ' · 原时长 ' + formatDuration(dur) : '') +
    (closure.autoClosed ? ' · 已自动闭合' : ''), 'ok');
});

el('routeExport').addEventListener('click', () => {
  if (S.route.length < 2) return;
  const lines = [
    '<?xml version="1.0" encoding="UTF-8"?>',
    '<gpx version="1.1" creator="iap2loc" xmlns="http://www.topografix.com/GPX/1/1">',
    '  <trk><name>iap2loc route</name><trkseg>'
  ];
  const pts = [...S.route];
  const closure = getClosureInfo();
  if (closure.autoClosed) pts.push({ ...S.route[0], time: null });
  pts.forEach(p => {
    let seg = '    <trkpt lat="' + p.lat.toFixed(6) + '" lon="' + p.lon.toFixed(6) + '">';
    if (p.alt != null && Number.isFinite(p.alt)) seg += '<ele>' + p.alt.toFixed(1) + '</ele>';
    if (p.time != null && Number.isFinite(p.time)) seg += '<time>' + new Date(p.time).toISOString() + '</time>';
    seg += '</trkpt>';
    lines.push(seg);
  });
  lines.push('  </trkseg></trk>', '</gpx>');
  const blob = new Blob([lines.join('\n')], { type: 'application/gpx+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:T]/g, '').slice(0, 12);
  a.href = url;
  a.download = 'iap2loc-route-' + stamp + '.gpx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  notify('已导出 GPX 文件', 'ok');
});

function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length > 0) return [];
  const nodes = [
    ...doc.getElementsByTagName('trkpt'),
    ...doc.getElementsByTagName('rtept'),
    ...doc.getElementsByTagName('wpt')
  ];
  const points = [];
  nodes.forEach(node => {
    const lat = parseFloat(node.getAttribute('lat'));
    const lon = parseFloat(node.getAttribute('lon'));
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    let alt = null;
    const ele = node.getElementsByTagName('ele')[0];
    if (ele) { const v = parseFloat(ele.textContent); if (Number.isFinite(v)) alt = v; }
    let time = null;
    const stamp = node.getElementsByTagName('time')[0];
    if (stamp) { const v = Date.parse(stamp.textContent.trim()); if (Number.isFinite(v)) time = v; }
    const last = points[points.length - 1];
    if (last && Math.abs(last.lat - lat) < 1e-7 && Math.abs(last.lon - lon) < 1e-7) return;
    points.push({ lat: +clampLat(lat).toFixed(6), lon: +wrapLon(lon).toFixed(6), alt, time });
  });
  if (!points.every(p => p.time != null)) points.forEach(p => { p.time = null; });
  return points;
}

function downsample(points, limit) {
  if (points.length <= limit) return points;
  const step = (points.length - 1) / (limit - 1);
  const result = [];
  for (let i = 0; i < limit; i++) result.push(points[Math.round(i * step)]);
  return result;
}

function fitView() {
  if (!map) return;
  if (S.mode === 'path' && S.route.length >= 2) {
    map.fitBounds(L.latLngBounds(S.route.map(toLatLng)), { padding: [55, 55] });
  } else if (S.mode === 'path' && S.route.length === 1) {
    map.setView(toLatLng(S.route[0]), Math.max(map.getZoom(), 15));
  } else if (S.mode === 'path') {
    map.setView(toLatLng(getCurrentDevicePoint(S.serverTarget)), Math.max(map.getZoom(), 15));
  } else {
    map.setView(toLatLng({ lat: S.target.lat, lon: S.target.lon }), Math.max(map.getZoom(), 14));
  }
}

/* ---------- map search ---------- */
async function runSearch() {
  const q = el('searchInput').value.trim();
  const box = el('searchResults');
  if (!q) { box.style.display = 'none'; return; }

  // Direct coordinate input: "31.2304, 121.4737" or "31.2304 121.4737"
  const coordMatch = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (coordMatch) {
    const a = parseFloat(coordMatch[1]), b = parseFloat(coordMatch[2]);
    if (Math.abs(a) <= 90 && Math.abs(b) <= 180) {
      box.style.display = 'none';
      jumpToCoord(a, b, '已定位到坐标 ' + a.toFixed(5) + ', ' + b.toFixed(5));
      return;
    }
  }

  box.style.display = 'block';
  box.innerHTML = '<div class="search-item"><span class="s-sub">搜索中…</span></div>';
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 6000);
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=zh-CN&q=' + encodeURIComponent(q);
    const resp = await fetch(url, { signal: controller.signal });
    const list = await resp.json();
    if (!Array.isArray(list) || list.length === 0) {
      box.innerHTML = '<div class="search-item"><span class="s-sub">未找到匹配地点</span></div>';
      return;
    }
    box.innerHTML = '';
    list.forEach(item => {
      const lat = parseFloat(item.lat), lon = parseFloat(item.lon);
      const parts = String(item.display_name || '').split(',');
      const title = parts[0] || item.display_name;
      const sub = parts.slice(1).join(',').trim();
      const row = document.createElement('div');
      row.className = 'search-item';
      row.innerHTML = '<div class="s-title">' + escapeHtml(title) + '</div>' +
        (sub ? '<div class="s-sub">' + escapeHtml(sub) + '</div>' : '');
      row.addEventListener('click', () => {
        box.style.display = 'none';
        jumpToCoord(lat, lon, '已定位到 ' + title);
      });
      box.appendChild(row);
    });
  } catch (err) {
    box.style.display = 'none';
    notify('在线搜索服务不可达，可直接输入 "纬度,经度" 跳转', 'error');
  } finally {
    clearTimeout(timer);
  }
}

function jumpToCoord(wLat, wLon, message) {
  if (S.mode === 'point') {
    applyPicked(wLat, wLon);
  }
  if (map) {
    map.setView(toLatLng({ lat: wLat, lon: wLon }), Math.max(map.getZoom(), 15));
  }
  notify(message);
}

function num(id, fallback) {
  const value = parseFloat(el(id).value);
  return Number.isFinite(value) ? value : fallback;
}

function readInputs() {
  if (S.mode === 'point') {
    const lat = parseFloat(el('lat').value), lon = parseFloat(el('lon').value);
    if (Number.isFinite(lat)) S.target.lat = clampLat(lat);
    if (Number.isFinite(lon)) S.target.lon = wrapLon(lon);
  }
  S.target.accuracy = Math.max(0.5, num('accuracy', 2.5));
  S.target.alt = num('alt', 5);
  S.target.jitterAccuracy = el('jitterAccuracy').checked;
  S.target.jitterAltitude = el('jitterAltitude').checked;
  S.target.accuracyMin = Math.max(0.1, num('accuracyMin', 3));
  S.target.accuracyMax = Math.max(S.target.accuracyMin, num('accuracyMax', 12));
  S.target.jitterMeters = Math.max(0, num('jitterMeters', 0));
  const quality = parseInt(el('quality').value, 10);
  S.target.quality = Number.isFinite(quality) ? quality : 4;
  const satellites = parseInt(el('satellites').value, 10);
  S.target.satellites = Number.isFinite(satellites) ? Math.max(0, Math.min(99, satellites)) : 20;
  S.target.altitudeMin = num('altitudeMin', 5);
  S.target.altitudeMax = Math.max(S.target.altitudeMin, num('altitudeMax', 20));
  S.pathSpeed = Math.max(0.5, num('pathSpeed', 5));
  S.pathAutoClose = el('pathAutoClose').checked;
  S.pathSpeedJitter = parseFloat(el('pathSpeedJitter').value) || 0;
  S.pathUseGpxTime = el('pathUseGpxTime').checked;
  S.rate = Math.max(10, num('rate', 250));
  S.identity = el('identity').value.trim();
  S.transport = el('transport').value;
  S.host = el('host').value.trim();
  S.port = num('port', 8738);
}

function onEdited() {
  readInputs();
  renderTarget(false);
  renderRouteInfo();
  markDirty(false);
}

function markDirty(isRouteChange = false) {
  dirty = true;
  if (isRouteChange) routeDirty = true;
  el('apply').disabled = false;
  el('apply').classList.add('dirty');
  el('apply').textContent = S.mode === 'path' ? '应用路径与参数' : '应用定位修改';
  el('dirtyChip').style.display = '';
  renderPathUi();
}

function markClean() {
  dirty = false;
  routeDirty = false;
  el('apply').disabled = true;
  el('apply').classList.remove('dirty');
  el('apply').textContent = '已同步生效';
  el('dirtyChip').style.display = 'none';
}

function buildPayload(options = {}) {
  const tolerateEmptyRoute = !!options.tolerateEmptyRoute;
  const mode = S.mode === 'path' && tolerateEmptyRoute && S.route.length < 2 ? 'point' : S.mode;
  const payload = {
    mode,
    latitude: clampLat(S.target.lat), longitude: wrapLon(S.target.lon),
    altitude: S.target.alt, accuracy: S.target.accuracy,
    jitterMeters: S.target.jitterMeters,
    jitterAccuracy: S.target.jitterAccuracy, accuracyMin: S.target.accuracyMin, accuracyMax: S.target.accuracyMax,
    quality: S.target.quality, satellites: S.target.satellites,
    jitterAltitude: S.target.jitterAltitude, altitudeMin: S.target.altitudeMin, altitudeMax: S.target.altitudeMax,
    rate: S.rate,
    pathSpeedKmh: S.pathSpeed,
    pathLoopMode: S.pathLoopMode,
    pathAutoClose: S.pathAutoClose,
    pathSpeedJitterPercent: S.pathSpeedJitter,
    pathUseGpxTime: S.pathUseGpxTime,
    pathTimeScale: S.pathTimeScale,
    route: mode === 'path'
      ? S.route.map(p => ({ latitude: clampLat(p.lat), longitude: wrapLon(p.lon), altitude: p.alt, time: p.time }))
      : null
  };
  if (options.pathPaused !== undefined) payload.pathPaused = options.pathPaused;
  return payload;
}

async function applyTarget(options = {}) {
  readInputs();
  renderTarget(false);

  if (S.mode === 'path' && S.route.length < 2 && !options.tolerateEmptyRoute) {
    notify('路径模式至少需要 2 个路径点，或导入 GPX', 'error');
    return false;
  }

  const seq = ++stateMutationSeq;
  const result = await postJson('/api/target', buildPayload(options));
  if (result && result.ok) {
    markClean();
    if (result.target && seq >= stateMutationSeq) {
      S.serverTarget = result.target;
      S.lastSyncedRouteSig = result.target.routeInputSignature || '0';
      renderApplied(result.target);
    }
    renderTarget(true);
    renderPathUi();
    updateLiveMarker(S.serverTarget, false);
    return true;
  }

  notify((result && result.error) || '应用失败', 'error');
  return false;
}

function renderApplied(target) {
  if (!target) return;
  renderDeviceLocationCard(target);
  const fDot = el('footerDot');
  const extras = [];
  if (target.currentAccuracy != null) extras.push('精度 ' + target.currentAccuracy.toFixed(1) + 'm');
  if (target.currentAltitude != null) extras.push('高度 ' + target.currentAltitude.toFixed(1) + 'm');
  const suffix = extras.length ? ' · ' + extras.join(' · ') : '';

  if (target.mode === 'path' && target.routePoints >= 2) {
    const stateTxt = target.pathReachedEnd ? '已到达' : (target.pathPaused ? '已暂停' : (target.pathCurrentSpeedMps * 3.6).toFixed(1) + 'km/h');
    fDot.className = 'dot ' + (target.pathReachedEnd ? 'accent' : (target.pathPaused ? 'warn' : 'ok pulse'));
    el('appliedText').textContent = '路径(' + stateTxt + ') · ' +
      formatDistance(target.pathTravelledMeters) + '/' + formatDistance(target.routeLengthMeters) + suffix;
  } else {
    fDot.className = 'dot ok';
    const lat = target.resolvedLatitude != null ? target.resolvedLatitude : target.latitude;
    const lon = target.resolvedLongitude != null ? target.resolvedLongitude : target.longitude;
    el('appliedText').textContent = '单点 · ' + lat.toFixed(5) + ', ' + lon.toFixed(5) + suffix;
  }
}

    return;
  }
  const tag = (event.target && event.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if (event.code === 'Space' && S.mode === 'path' && S.route.length >= 2) {

/* ---------- logs & toast ---------- */
const logBuffer = [];
let logVisible = false;
function setLogVisible(on) {
  logVisible = on;
  el('showLog').checked = on;
  document.body.classList.toggle('log-hidden', !on);
  try { localStorage.setItem('iap2loc.showLog', on ? '1' : '0'); } catch (e) {}
  if (on) {
    el('log').innerHTML = '';
    logBuffer.slice(-300).forEach(appendLogDom);
    el('log').scrollTop = el('log').scrollHeight;
  }
}
el('showLog').addEventListener('change', () => setLogVisible(el('showLog').checked));

function appendLog(entry) {
  logBuffer.push(entry);
  if (logBuffer.length > 400) logBuffer.shift();
  if (logVisible) appendLogDom(entry);
}
function appendLogDom(entry) {
  const node = document.createElement('div');
  const level = (entry.level || '').trim();
  node.innerHTML = '<span class="t">' + escapeHtml(entry.time) + '</span> <span class="' + escapeHtml(level) + '">' + escapeHtml(level) + '</span> ' + escapeHtml(entry.text);
  const log = el('log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.appendChild(node);
  if (atBottom) log.scrollTop = log.scrollHeight;
  while (log.childElementCount > 400) log.removeChild(log.firstChild);
}

let toastTimer = null;
function notify(text, level = '') {
  const toast = el('toast');
  toast.textContent = text;
  toast.className = level;
  toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 3500);
}

/* ---------- API helpers ---------- */
async function postJson(path, body) {
  try {
    const resp = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    return await resp.json();
  } catch (error) { return { ok: false, error: String(error) }; }
}
async function getJson(path) {
  try { return await (await fetch(path)).json(); } catch (error) { return null; }
}

  }
  const loopLabel = { once: '单次', loop: '环形', pingPong: '往返' };
  box.innerHTML = '';
  S.savedRoutes.forEach(rt => {
    const row = document.createElement('div');
    row.className = 'item clickable';
    row.dataset.routeId = rt.id;
    const modeTxt = loopLabel[rt.loopMode] || '环形';
    row.innerHTML =
      '<div class="name">' + escapeHtml(rt.name) +
      '<div class="sub">' + (rt.points ? rt.points.length : 0) + ' 点 · ' + formatDistance(rt.lengthMeters) +
      ' · ' + (rt.speedKmh || 5) + ' km/h · ' + modeTxt + '</div></div>' +
      '<button class="xs danger" data-remove-route="' + escapeHtml(rt.id) + '">✕</button>';
    box.appendChild(row);
  });
}

el('favorites').addEventListener('click', async event => {
  const btn = event.target.closest('button[data-remove]');
  if (btn) {
    await postJson('/api/favorites/remove', { id: btn.dataset.remove });
    loadFavorites();
    return;
  }
  const row = event.target.closest('.item');
  if (!row) return;
  const fav = S.favorites.find(f => f.id === row.dataset.id);
  if (!fav) return;
  S.target.lat = clampLat(fav.latitude);
  S.target.lon = wrapLon(fav.longitude);
  if (fav.altitude != null) { S.target.alt = fav.altitude; el('alt').value = fav.altitude; }
  if (fav.accuracy != null) { S.target.accuracy = fav.accuracy; el('accuracy').value = fav.accuracy; }
  setMode('point', true);
  setTab('loc');
  renderTarget(true);
  readInputs();
  markDirty(false);
  fitView();
});

el('savedRoutes').addEventListener('click', async event => {
  const btn = event.target.closest('button[data-remove-route]');
  if (btn) {
    await postJson('/api/routes/remove', { id: btn.dataset.removeRoute });
    loadSavedRoutes();
    return;
  }
  const row = event.target.closest('.item');
  if (!row) return;
  const rt = S.savedRoutes.find(r => r.id === row.dataset.routeId);
  if (!rt || !Array.isArray(rt.points) || rt.points.length < 2) return;
  pushRouteHistory();
  S.route = rt.points.map(p => ({ lat: p.latitude, lon: p.longitude, alt: p.altitude ?? null, time: p.time ?? null }));
  S.pathSpeed = rt.speedKmh || 5;
  el('pathSpeed').value = String(S.pathSpeed);
  updateSpeedPresetsHighlight();
  setLoopModeUi(rt.loopMode || 'loop');
  S.pathAutoClose = rt.autoClose !== false;
  el('pathAutoClose').checked = S.pathAutoClose;
  S.mode = 'path';
  S.routeEditing = false;
  setTab('loc');
  renderModes();
  setRouteEditing(false);
  fitView();
  markDirty(true);
  notify('已载入路径「' + rt.name + '」，点击「开始移动」即可启动');
});

/* ---------- geolocation & clipboard ---------- */
el('locate').addEventListener('click', () => {
  if (!navigator.geolocation) { notify('当前浏览器不支持本机定位', 'error'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = +pos.coords.latitude.toFixed(6);
    const lon = +pos.coords.longitude.toFixed(6);
    if (S.mode === 'point') {
      S.target.lat = lat;
      S.target.lon = lon;
      if (Number.isFinite(pos.coords.altitude)) { S.target.alt = +pos.coords.altitude.toFixed(1); el('alt').value = S.target.alt; }
      if (Number.isFinite(pos.coords.accuracy)) { S.target.accuracy = Math.max(1, +pos.coords.accuracy.toFixed(1)); el('accuracy').value = S.target.accuracy; }
      renderTarget(true);
      readInputs();
      markDirty(false);
    }
    if (map) map.setView(toLatLng({ lat, lon }), 15);
    notify('已定位到本机当前位置');
  }, () => notify('浏览器拒绝或无法取得本机位置', 'error'));
});

el('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(S.target.lat.toFixed(6) + ',' + S.target.lon.toFixed(6));
    notify('已复制坐标到剪贴板', 'ok');
  } catch (e) { notify('复制失败', 'error'); }
});

/* ---------- state sync & polling ---------- */
function renderIdentity(identity) {
  if (!identity) return;
  el('identityText').textContent = identity.serial + ' · ' + identity.model + (identity.adapter ? ' · BT 改写' : '');
  el('identityText').title = identity.adapter ? '蓝牙地址 ' + identity.adapter + '\n' + (identity.path || '') : (identity.path || '');
}

function renderWarning(text) {
  const box = el('buildWarning');
  if (!text) { box.style.display = 'none'; box.textContent = ''; return; }
  box.innerHTML = escapeHtml(text).replace(/(https?:\/\/[^\s）)]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
  box.style.display = 'block';
}

async function syncInitialFromTarget(target) {
  S.hasInitialSync = true;
  if (!target) return;

  S.target.lat = target.latitude;
  S.target.lon = target.longitude;
  if (target.altitude != null) { S.target.alt = target.altitude; el('alt').value = target.altitude; }
  if (target.accuracy != null) { S.target.accuracy = target.accuracy; el('accuracy').value = target.accuracy; }
  S.target.jitterMeters = target.jitterMeters || 0;
  el('jitterMeters').value = S.target.jitterMeters;
  S.target.jitterAccuracy = !!target.jitterAccuracy;
  el('jitterAccuracy').checked = S.target.jitterAccuracy;
  el('accuracyMin').value = target.accuracyMin ?? 3;
  el('accuracyMax').value = target.accuracyMax ?? 12;
  S.target.jitterAltitude = !!target.jitterAltitude;
  el('jitterAltitude').checked = S.target.jitterAltitude;
  el('altitudeMin').value = target.altitudeMin ?? 5;
  el('altitudeMax').value = target.altitudeMax ?? 20;
  el('quality').value = String(target.quality ?? 4);
  el('satellites').value = String(target.satellites ?? 20);
  syncJitterVisibility();

  S.pathSpeed = +(target.pathSpeedMps * 3.6).toFixed(1) || 5;
  el('pathSpeed').value = String(S.pathSpeed);
  updateSpeedPresetsHighlight();
  setLoopModeUi(target.pathLoopMode || 'loop');
  S.pathAutoClose = target.pathAutoClose !== false;
  el('pathAutoClose').checked = S.pathAutoClose;
  S.pathSpeedJitter = Math.round(target.pathSpeedJitterPercent || 0);
  el('pathSpeedJitter').value = String(S.pathSpeedJitter);
  el('speedJitterText').textContent = '±' + S.pathSpeedJitter + '%';
  S.pathUseGpxTime = target.pathUseGpxTime !== false;
  el('pathUseGpxTime').checked = S.pathUseGpxTime;
  S.pathTimeScale = target.pathTimeScale || 1;
  document.querySelectorAll('#gpxScalePresets button').forEach(b => {
    b.classList.toggle('active', Math.abs(parseFloat(b.dataset.scale) - S.pathTimeScale) < 0.05);
  });

  if (target.routePoints >= 2) {
    const routeData = await getJson('/api/route');
    if (routeData && Array.isArray(routeData.points) && routeData.points.length >= 2) {
      S.route = routeData.points.map(p => ({ lat: p.lat, lon: p.lon, alt: p.alt ?? null, time: p.time ?? null }));
      S.lastSyncedRouteSig = routeData.inputSignature || '0';
      if (target.mode === 'path') {
        S.mode = 'path';
        S.routeEditing = false;
      }
    }
  }

  renderTarget(true);
  renderModes();
  setRouteEditing(S.routeEditing);
  markClean();
  if (S.mode === 'path' && S.route.length >= 2) fitView();
}

async function pollState() {
  const seqBefore = stateMutationSeq;
  const state = await getJson('/api/state');
  if (!state) return;
  S.sessions = state.sessions || [];
  renderSessions();
  renderWarning(state.warning);
  renderIdentity(state.identity);

  if (state.target && seqBefore === stateMutationSeq) {
    S.serverTarget = state.target;
    if (!S.hasInitialSync) {
      await syncInitialFromTarget(state.target);
    }
    renderApplied(state.target);
    renderPathUi();
    updateLiveMarker(state.target, true);
  }
}

let lastLog = 0;
async function pollLog() {
  const data = await getJson('/api/log?since=' + lastLog);
  if (!data) return;
  lastLog = data.last;
  (data.entries || []).forEach(appendLog);
}

/* ---------- boot ---------- */
buildModes();
initMap();

let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!map) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => map.invalidateSize(), 150);
});

renderTarget(true);
renderModes();
syncJitterVisibility();
markClean();

try { logVisible = localStorage.getItem('iap2loc.showLog') === '1'; } catch (e) { logVisible = false; }
setLogVisible(logVisible);

loadDevices();
loadFavorites();
loadSavedRoutes();
pollState();
pollLog();
setInterval(pollState, 600);
setInterval(pollLog, 1200);
</script>
</body>
</html>
