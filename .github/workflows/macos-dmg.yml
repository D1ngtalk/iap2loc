name: macOS Bluetooth build, test and DMG

on:
  push:
    branches:
      - feature/macos-iobluetooth-rfcomm-dmg
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - '**/*.cs'
      - '*.cs'
      - '*.csproj'
      - 'Native/**'
      - 'scripts/**'
      - 'README-macOS.md'
      - '.github/workflows/macos-dmg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iap2loc-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    name: Build dual-architecture DMG + Intel x64 smoke test
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate Intel build host
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = x86_64
          xcrun --find clang
          dotnet --info

      - name: Compile .NET project
        run: dotnet build Iap2Loc.csproj --configuration Release --nologo

      - name: Build signed apps and DMG
        run: bash scripts/package-macos.sh

      - name: Mount and smoke-test Intel x64 DMG app
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find releases -type f -name 'iap2loc-macOS-Bluetooth-*.dmg' | head -1)"
          test -n "$DMG"
          bash scripts/smoke-macos.sh "$DMG" x64

      - name: Upload verified DMG, source and checksums
        uses: actions/upload-artifact@v4
        with:
          name: iap2loc-macos-dmg
          path: |
            releases/iap2loc-macos-bt-*/*.dmg
            releases/iap2loc-macos-bt-*/source.tar.gz
            releases/iap2loc-macos-bt-*/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  arm64-smoke:
    name: Apple Silicon ARM64 DMG smoke test
    needs: build-dmg
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout test script
        uses: actions/checkout@v4

      - name: Retrieve exactly the built DMG
        uses: actions/download-artifact@v4
        with:
          name: iap2loc-macos-dmg
          path: package

      - name: Mount and smoke-test ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          DMG="$(find package -type f -name 'iap2loc-macOS-Bluetooth-*.dmg' | head -1)"
          test -n "$DMG"
          bash scripts/smoke-macos.sh "$DMG" arm64

  release:
    name: Publish prerelease on version tag
    needs:
      - build-dmg
      - arm64-smoke
    if: github.repository == 'shzxm/iap2loc' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the exact CI-tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: iap2loc-macos-dmg
          path: package

      - name: Publish experimental GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="$(find package -type f -name 'iap2loc-macOS-Bluetooth-*.dmg' | head -1)"
          test -n "$DMG"
          test -f package/SHA256SUMS
          test -f package/source.tar.gz
          gh release create "$GITHUB_REF_NAME" "$DMG" package/SHA256SUMS package/source.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease \
            --title "iap2loc macOS Bluetooth $GITHUB_REF_NAME" \
            --notes "Experimental macOS ARM64/Intel build from GitHub Actions. CI validates the DMG and both applications; real iPhone SDP/RFCOMM and MFi authentication must still be tested. Ad-hoc signed, not notarized."
